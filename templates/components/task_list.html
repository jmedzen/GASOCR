                        <span x-text="isResumingAll ? '接續中...' : '全部繼續'"></span>

            <div x-show="selectedTaskIds.length > 0" x-transition class="mb-3 px-4 py-2.5 bg-rose-50/90 border border-rose-200 rounded-xl flex items-center justify-between flex-wrap gap-2 text-xs shadow-xs">

                    <div class="flex items-center space-x-1.5 font-bold text-rose-950">
                        <i data-lucide="check-square" class="w-4 h-4 text-rose-600"></i>
                        <span>已選取 <span class="font-mono text-sm text-rose-700" x-text="selectedTaskIds.length"></span> 個任務</span>
                    </div>
                    <span class="text-rose-300">|</span>
                    <button type="button" @click="selectedTaskIds = []" class="text-rose-700 hover:text-rose-900 font-semibold cursor-pointer underline">
                        取消選取
                    </button>
                    <button type="button" @click="toggleSelectAllTasks()" class="text-rose-700 hover:text-rose-900 font-semibold cursor-pointer underline">

                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <button type="button" @click="pauseSelectedTasks()" :disabled="isPausingAll" class="px-2.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 font-semibold shadow-xs transition flex items-center space-x-1 cursor-pointer disabled:opacity-50" title="暫停已選取的任務">
                        <i data-lucide="pause" class="w-3.5 h-3.5"></i>
                        <span>暫停選取 (<span x-text="selectedTaskIds.length"></span>)</span>
                    </button>
                    <button type="button" @click="resumeSelectedTasks()" :disabled="isResumingAll" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 font-semibold shadow-xs transition flex items-center space-x-1 cursor-pointer disabled:opacity-50" title="接續已選取的任務">
                        <i data-lucide="play" class="w-3.5 h-3.5"></i>

                    </button>
                    <button type="button" @click="deleteSelectedTasks()" :disabled="isBatchDeleting" class="px-3.5 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold shadow-xs transition flex items-center space-x-1.5 cursor-pointer disabled:opacity-50">

                        <span x-text="isBatchDeleting ? '刪除中...' : `批次刪除選取 (${selectedTaskIds.length})`"></span>
                    </button>
                </div>
            </div>

            <!-- Task List 2-Row Optimized Layout with Filter & Sort Toolbar -->
            <div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-xs">
                <!-- Header Filter & Sort Bar (狀態篩選與排序工具列) -->
                <div class="px-4 py-2 bg-slate-50/90 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2.5 text-xs">

                    <div class="flex items-center flex-wrap gap-1.5 sm:gap-2">
                        <!-- 全選 Checkbox -->
                        <div class="flex items-center space-x-1.5 pr-2 border-r border-slate-200 dark:border-slate-700">
                            <input type="checkbox" 
                                :checked="filteredAndSortedTasks.length > 0 && isAllFilteredTasksSelected"
                                :indeterminate.prop="selectedTaskIds.length > 0 && !isAllFilteredTasksSelected"
                                @change="toggleSelectAllFilteredTasks()"
                                class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer"
                                title="選取當前列表中的所有任務">
                            <span class="font-semibold text-slate-700 dark:text-slate-300 hidden sm:inline">全選</span>
                        </div>

                        <!-- 狀態篩選 Tabs -->
                        <div class="flex items-center space-x-1 overflow-x-auto custom-scroll py-0.5">
                            <!-- 全部 -->
                            <button type="button" @click="taskFilterStatus = 'all'" 
                                class="px-2.5 py-1 rounded-lg font-semibold transition flex items-center space-x-1 text-xs cursor-pointer"
                                :class="taskFilterStatus === 'all' 
                                    ? 'bg-blue-600 text-white shadow-2xs' 
                                    : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'">
                                <span>全部</span>
                                <span class="px-1.5 py-0.2 rounded-full text-[10px]" :class="taskFilterStatus === 'all' ? 'bg-blue-700 text-blue-100' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'" x-text="allTasks.length"></span>
                            </button>

                            <!-- 等待中 -->
                            <button type="button" @click="taskFilterStatus = 'pending'" 
                                class="px-2.5 py-1 rounded-lg font-semibold transition flex items-center space-x-1 text-xs cursor-pointer"
                                :class="taskFilterStatus === 'pending' 
                                    ? 'bg-slate-700 text-white shadow-2xs' 
                                    : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'">
                                <span>⏳ 等待中</span>
                                <span class="px-1.5 py-0.2 rounded-full text-[10px]" :class="taskFilterStatus === 'pending' ? 'bg-slate-800 text-slate-200' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'" x-text="taskStatusCounts.pending"></span>
                            </button>

                            <!-- 切圖中 -->
                            <button type="button" @click="taskFilterStatus = 'rendering'" 
                                class="px-2.5 py-1 rounded-lg font-semibold transition flex items-center space-x-1 text-xs cursor-pointer"
                                :class="taskFilterStatus === 'rendering' 
                                    ? 'bg-amber-600 text-white shadow-2xs' 
                                    : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'">
                                <span>🖼️ 切圖中</span>
                                <span class="px-1.5 py-0.2 rounded-full text-[10px]" :class="taskFilterStatus === 'rendering' ? 'bg-amber-700 text-amber-100' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'" x-text="taskStatusCounts.rendering"></span>
                            </button>

                            <!-- OCR中 -->
                            <button type="button" @click="taskFilterStatus = 'processing'" 
                                class="px-2.5 py-1 rounded-lg font-semibold transition flex items-center space-x-1 text-xs cursor-pointer"
                                :class="taskFilterStatus === 'processing' 
                                    ? 'bg-blue-600 text-white shadow-2xs' 
                                    : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'">
                                <span>⚡ OCR中</span>
                                <span class="px-1.5 py-0.2 rounded-full text-[10px]" :class="taskFilterStatus === 'processing' ? 'bg-blue-700 text-blue-100' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'" x-text="taskStatusCounts.processing"></span>
                            </button>

                            <!-- 已完成 -->
                            <button type="button" @click="taskFilterStatus = 'completed'" 
                                class="px-2.5 py-1 rounded-lg font-semibold transition flex items-center space-x-1 text-xs cursor-pointer"
                                :class="taskFilterStatus === 'completed' 
                                    ? 'bg-emerald-600 text-white shadow-2xs' 
                                    : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'">
                                <span>✅ 已完成</span>
                                <span class="px-1.5 py-0.2 rounded-full text-[10px]" :class="taskFilterStatus === 'completed' ? 'bg-emerald-700 text-emerald-100' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'" x-text="taskStatusCounts.completed"></span>
                            </button>

                            <!-- 暫停中 (若有則顯示) -->
                            <button type="button" x-show="taskStatusCounts.paused > 0" @click="taskFilterStatus = 'paused'" 
                                class="px-2.5 py-1 rounded-lg font-semibold transition flex items-center space-x-1 text-xs cursor-pointer"
                                :class="taskFilterStatus === 'paused' 
                                    ? 'bg-purple-600 text-white shadow-2xs' 
                                    : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'">
                                <span>⏸ 暫停中</span>
                                <span class="px-1.5 py-0.2 rounded-full text-[10px]" :class="taskFilterStatus === 'paused' ? 'bg-purple-700 text-purple-100' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400'" x-text="taskStatusCounts.paused"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Right: 排序選單 (最新優先、最舊優先、檔名排序) -->
                    <div class="flex items-center space-x-1.5 shrink-0">
                        <span class="text-slate-400 font-medium text-[11px] hidden sm:inline">排序：</span>
                        <div class="relative inline-flex items-center">
                            <select 
                                x-model="taskSortBy" 
                                class="appearance-none bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg pl-2.5 pr-7 py-1 text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer shadow-2xs"
                                title="切換任務排序方式"
                            >
                                <option value="newest">🕒 最新優先</option>
                                <option value="oldest">⏳ 最舊優先</option>
                                <option value="filename">🔤 檔名排序 (A-Z)</option>
                            </select>
                            <svg class="w-3.5 h-3.5 text-slate-400 absolute right-2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Task Items 2-Row List -->
                <div class="divide-y divide-slate-100 dark:divide-slate-800/80 bg-white dark:bg-slate-900">
                    <template x-for="task in filteredAndSortedTasks" :key="task.id">
                        <div class="p-3.5 hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition cursor-pointer flex flex-col justify-between gap-2.5"
                             :class="{
                                 'bg-blue-50/70 dark:bg-blue-950/40 border-l-4 border-l-blue-600': selectedTaskIds.includes(task.id),
                                 'bg-blue-50/20 dark:bg-blue-950/20': currentTaskId === task.id && !selectedTaskIds.includes(task.id)
                             }"
                             @click="inspectTask(task)">
                             
                            <!-- Row 1: 核心識別、檔名與主要操作按鈕 -->
                            <div class="flex items-center justify-between gap-3">
                                <!-- Left: Checkbox + File Icon + Filename + Paid Badge -->
                                <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                                    <div class="shrink-0 flex items-center" @click.stop>
                                        <input type="checkbox" 
                                            :value="task.id" 
                                            x-model="selectedTaskIds" 
                                            class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
                                    </div>
                                    <div class="w-7 h-7 rounded-lg bg-blue-50 dark:bg-blue-950/60 flex items-center justify-center text-blue-600 dark:text-blue-400 shrink-0">
                                        <i data-lucide="file-text" class="w-4 h-4"></i>
                                    </div>
                                    <span class="font-bold text-sm text-slate-800 dark:text-slate-100 truncate max-w-[240px] sm:max-w-sm md:max-w-md lg:max-w-xl" :title="task.filename" x-text="task.filename"></span>
                                    <template x-if="task.is_paid">
                                        <span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-amber-100 text-amber-800 border border-amber-300 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-700 shrink-0">💎 付費</span>
                                    </template>
                                </div>

                                <!-- Right: Actions Buttons -->
                                <div class="flex items-center space-x-1.5 shrink-0" @click.stop>
                                    <template x-if="['processing', 'rendering', 'pending'].includes(task.status)">
                                        <button @click="toggleTaskPause(task)" class="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-300 rounded-lg text-xs font-semibold transition flex items-center space-x-1 shadow-2xs" title="暫停任務 (停止切圖/辨識)">
                                            <i data-lucide="pause" class="w-3.5 h-3.5"></i>
                                            <span>暫停</span>
                                        </button>
                                    </template>
                                    <template x-if="['paused', 'failed'].includes(task.status)">
                                        <button @click="toggleTaskPause(task)" class="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 rounded-lg text-xs font-semibold transition shadow-xs flex items-center space-x-1" title="繼續任務 (接續切圖/辨識)">
                                            <i data-lucide="play" class="w-3.5 h-3.5"></i>
                                            <span>繼續</span>
                                        </button>
                                    </template>
                                    <button @click="inspectTask(task)" class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-800 text-xs font-semibold transition flex items-center space-x-1 shadow-2xs" title="檢視辨識成果與校對">
                                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                        <span>校對</span>
                                    </button>
                                    <button @click="deleteTask(task.id)" class="px-2 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 dark:bg-rose-950/60 dark:text-rose-400 dark:border-rose-800 rounded-lg text-xs font-medium transition flex items-center space-x-1" title="刪除任務">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                        <span>刪除</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Row 2: 範圍、模型(或切換選單)、Status Badge(移至進度條左側) + 進度條與指標 -->
                            <div class="flex items-center justify-between gap-3 text-xs pt-1.5 border-t border-slate-100/80 dark:border-slate-800/60">
                                <!-- Left: Range + Model & Lang -->
                                <div class="flex items-center flex-wrap gap-2 text-slate-500 dark:text-slate-400">
                                    <!-- 縮排占位 -->
                                    <div class="w-4 shrink-0 hidden sm:block"></div>

                                    <!-- 轉譯範圍 -->
                                    <span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded-md bg-slate-100/90 dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 text-[11px] font-mono font-medium text-slate-700 dark:text-slate-300">
                                        <i data-lucide="book-open" class="w-3 h-3 text-slate-400"></i>
                                        <span x-text="task.end_page && task.end_page > 0 ? `P.${task.start_page || 1} ~ P.${task.end_page}` : `P.${task.start_page || 1} ~ 全本`"></span>
                                    </span>

                                    <!-- 模型與語言 -->
                                    <div @click.stop>
                                        <template x-if="task.status === 'paused'">
                                            <div class="inline-flex items-center space-x-1 px-2 py-0.5 rounded-lg border border-amber-300/90 bg-amber-50/70 hover:bg-amber-100/70 dark:bg-amber-950/50 dark:border-amber-700 transition shadow-2xs">
                                                <span class="text-[11px] text-amber-600 dark:text-amber-400 font-bold">⚡ 切換模型:</span>
                                                <div class="relative inline-flex items-center">
                                                    <select 
                                                        x-model="task.model" 
                                                        @change="changeTaskModel(task)"
                                                        class="appearance-none bg-transparent pr-4 text-[11px] font-semibold text-slate-800 dark:text-slate-200 focus:outline-none cursor-pointer max-w-[170px] truncate py-0.5"
                                                        title="點擊更換接續執行的模型"
                                                    >
                                                        <template x-for="m in modelsList" :key="m.id || m">
                                                            <option :value="m.id || m" x-text="m.name || m.id || m" :selected="(m.id || m) === task.model"></option>
                                                        </template>
                                                    </select>
                                                    <svg class="w-3 h-3 text-amber-600 dark:text-amber-400 absolute right-0 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                                </div>
                                            </div>
                                        </template>
                                        <template x-if="task.status !== 'paused'">
                                            <div class="inline-flex items-center space-x-1.5 px-2 py-0.5 rounded-md bg-slate-100/80 dark:bg-slate-800 border border-slate-200/70 dark:border-slate-700 text-[11px]">
                                                <i data-lucide="cpu" class="w-3 h-3 text-indigo-500"></i>
                                                <span class="font-mono font-medium text-slate-700 dark:text-slate-300" x-text="task.model"></span>
                                                <span class="text-slate-400 text-[10px]" x-text="`(${task.lang_pref})`"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- Right: Status Badge (移動到進度條左邊) + Progress Bar & Indicators -->
                                <div class="flex items-center space-x-2.5 shrink-0">
                                    <!-- 1. Status Badge: 移到進度條左側，垂直對齊更加直觀清晰 -->
                                    <span class="inline-flex items-center space-x-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold tracking-wide shrink-0"
                                        :class="{
                                            'bg-blue-100/80 text-blue-800 border border-blue-200 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-800': task.status === 'processing',
                                            'bg-amber-100/80 text-amber-800 border border-amber-200 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800': task.status === 'rendering',
                                            'bg-purple-100/80 text-purple-800 border border-purple-200 dark:bg-purple-950/60 dark:text-purple-300 dark:border-purple-800': task.status === 'paused',
                                            'bg-emerald-100/80 text-emerald-800 border border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800': task.status === 'completed',
                                            'bg-red-100/80 text-red-800 border border-red-200 dark:bg-red-950/60 dark:text-red-300 dark:border-red-800': task.status === 'failed',
                                            'bg-slate-100 text-slate-600 border border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700': task.status === 'pending'
                                        }">
                                        <span class="w-1.5 h-1.5 rounded-full" :class="{
                                            'bg-blue-500 animate-ping': task.status === 'processing',
                                            'bg-amber-500 animate-pulse': task.status === 'rendering',
                                            'bg-purple-500': task.status === 'paused',
                                            'bg-emerald-500': task.status === 'completed',
                                            'bg-red-500': task.status === 'failed',
                                            'bg-slate-400 animate-pulse': task.status === 'pending'
                                        }"></span>
                                        <span x-text="getTaskStatusText(task.status)"></span>
                                    </span>

                                    <!-- 2. 進度條 -->
                                    <div class="w-24 sm:w-32 md:w-40 bg-slate-200/80 dark:bg-slate-700 rounded-full h-2 overflow-hidden shadow-inner">
                                        <div class="h-2 rounded-full transition-all duration-300"
                                            :class="{
                                                'bg-emerald-500': task.status === 'completed',
                                                'bg-blue-600': task.status === 'processing',
                                                'bg-amber-500 animate-pulse': task.status === 'rendering',
                                                'bg-purple-500': task.status === 'paused',
                                                'bg-red-500': task.status === 'failed',
                                                'bg-slate-300 dark:bg-slate-500': task.status === 'pending'
                                            }"
                                            :style="`width: ${task.total_pages ? (task.status === 'rendering' ? Math.min(100, Math.round((task.rendered_pages || 0)/task.total_pages*100)) : Math.min(100, Math.round((task.processed_pages || 0)/task.total_pages*100))) : 0}%`"></div>
                                    </div>

                                    <!-- 3. 進度指標數字 -->
                                    <span class="font-mono text-xs font-semibold whitespace-nowrap min-w-[95px] text-right" 
                                        :class="task.status === 'rendering' ? 'text-amber-700 dark:text-amber-400' : (task.status === 'pending' ? 'text-slate-500 dark:text-slate-400' : 'text-slate-700 dark:text-slate-300')"
                                        x-text="task.status === 'rendering' ? `切圖 ${task.rendered_pages || 0}/${task.total_pages || 0}` : (task.status === 'pending' ? `等待中 (${task.processed_pages || 0}/${task.total_pages || 0})` : `${task.processed_pages || 0}/${task.total_pages || 0} (${task.total_pages ? Math.round((task.processed_pages || 0)/task.total_pages*100) : 0}%)`)"></span>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- 當列表為空 -->
                    <template x-if="allTasks.length === 0">
                        <div class="p-10 text-center text-slate-400 dark:text-slate-500 flex flex-col items-center justify-center space-y-2">
                            <i data-lucide="inbox" class="w-8 h-8 opacity-40"></i>
                            <p class="text-xs">目前尚無任何轉譯任務，請在上方選取 PDF 檔案開始批次轉譯</p>
                        </div>
                    </template>

                    <!-- 當篩選後無符合項目 -->
                    <template x-if="allTasks.length > 0 && filteredAndSortedTasks.length === 0">
                        <div class="p-8 text-center text-slate-400 dark:text-slate-500 flex flex-col items-center justify-center space-y-2">
                            <i data-lucide="filter-x" class="w-7 h-7 opacity-40"></i>
                            <p class="text-xs">無符合當前狀態篩選的任務</p>
                            <button type="button" @click="taskFilterStatus = 'all'" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition cursor-pointer">
                                顯示全部任務
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
