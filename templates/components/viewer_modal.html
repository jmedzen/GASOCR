        <!-- Side-by-Side Comparison Area -->
        <div id="proofread-section" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col flex-1" x-show="currentTask">
            
            <!-- Page Selector Header -->
            <div class="px-6 py-3.5 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <!-- Page Navigation Pills & Previous/Next Buttons -->
                <div class="flex items-center space-x-2 overflow-x-auto py-1 custom-scroll max-w-full">
                    <!-- 上一頁快捷按鈕 -->
                    <button 
                        @click="prevPage()" 
                        :disabled="isFirstPage"
                        class="px-2.5 py-1 rounded-md text-xs font-semibold border transition flex items-center space-x-1 shrink-0"
                        :class="isFirstPage ? 'opacity-40 cursor-not-allowed bg-slate-100 text-slate-400 border-slate-200' : 'bg-white hover:bg-slate-100 text-slate-700 border-slate-300 shadow-xs cursor-pointer'"
                        :title="'切換至前一頁 (快速鍵: ' + modKeyLabel + '+← 或 ←)'"
                    >
                        <span>◀ 上一頁</span>
                        <kbd class="text-[10px] text-slate-400 font-mono hidden sm:inline"
                             x-text="modKeyLabel + '+←'">Alt+←</kbd>
                    </button>

                    <span class="text-xs font-semibold text-slate-500 mr-1 shrink-0">頁碼：</span>
                    <template x-for="p in pages" :key="p.page_num">
                        <button 
                            @click="selectPage(p.page_num)"
                            :data-page-btn="p.page_num"
                            class="px-2.5 py-1 rounded-md text-xs font-semibold transition flex items-center space-x-1 shrink-0"
                            :class="selectedPageNum === p.page_num 
                                ? 'bg-blue-600 text-white shadow-sm ring-2 ring-blue-400/40' 
                                : (p.status === 'completed' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100/70' : (p.status === 'failed' ? 'bg-red-50 text-red-700 border border-red-200 hover:bg-red-100/70' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'))"
                        >
                            <span x-text="`P.${p.page_num}`"></span>
                            <span x-show="p.status === 'completed'">✓</span>
                            <span x-show="p.status === 'failed'">✗</span>
                            <span x-show="p.status === 'processing'" class="animate-spin text-[10px]">⏳</span>
                        </button>
                    </template>

                    <!-- 下一頁快捷按鈕 -->
                    <button 
                        @click="nextPage()" 
                        :disabled="isLastPage"
                        class="px-2.5 py-1 rounded-md text-xs font-semibold border transition flex items-center space-x-1 shrink-0"
                        :class="isLastPage ? 'opacity-40 cursor-not-allowed bg-slate-100 text-slate-400 border-slate-200' : 'bg-white hover:bg-slate-100 text-slate-700 border-slate-300 shadow-xs cursor-pointer'"
                        :title="'切換至後一頁 (快速鍵: ' + modKeyLabel + '+→ 或 →)'"
                    >
                        <span>下一頁 ▶</span>
                        <kbd class="text-[10px] text-slate-400 font-mono hidden sm:inline"
                             x-text="modKeyLabel + '+→'">Alt+→</kbd>
                    </button>
                </div>

                <!-- Page Operations -->
                <div class="flex items-center flex-wrap gap-2" x-show="currentPage">
                    <!-- 當前辨識模型標記 -->
                    <span class="text-xs font-medium px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 border border-slate-200 shrink-0" x-show="currentPage?.used_model">
                        <span>辨識模型: </span>
                        <strong class="font-mono text-blue-600" x-text="currentPage?.used_model || ''"></strong>
                    </span>

                    <!-- 原模型重新辨識按鈕 -->
                    <button 
                        @click="retryCurrentPage()" 
                        :disabled="isRetryingPage"
                        class="px-2.5 py-1 rounded-lg border border-slate-300 hover:border-amber-400 bg-white hover:bg-amber-50 text-xs font-medium text-slate-700 transition flex items-center space-x-1 shadow-xs shrink-0 cursor-pointer"
                        :class="{'opacity-50 cursor-not-allowed': isRetryingPage}"
                        :title="'使用初始任務模型重新辨識本頁（快捷鍵: ' + modKeyLabel + '+R）'"
                    >
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-amber-600" :class="{'animate-spin': isRetryingPage && !isRetryingUpgrade}"></i>
                        <span x-text="currentPage?.status === 'processing' && !isRetryingUpgrade ? '辨識中 (點擊重試)' : '重新辨識本頁'"></span>
                        <kbd class="text-[10px] text-slate-400 font-mono hidden sm:inline ml-0.5"
                             x-text="modKeyLabel + '+R'">Alt+R</kbd>
                    </button>

                    <!-- 當前頁面轉譯中時的暫停按鈕 / 暫停中的繼續按鈕 -->
                    <template x-if="currentPage?.status === 'processing'">
                        <button 
                            @click="pauseCurrentPage()" 
                            class="px-2 py-1 rounded-lg border text-xs font-semibold transition flex items-center space-x-1 shadow-2xs cursor-pointer reocr-btn-pause"
                            :title="'暫停當前頁面的轉譯（快捷鍵: ' + modKeyLabel + '+P）'"
                        >
                            <i data-lucide="pause" class="w-3 h-3"></i>
                            <span>暫停</span>
                        </button>
                    </template>
                    <template x-if="currentPage?.status === 'paused'">
                        <button 
                            @click="retryCurrentPage()" 
                            class="px-2 py-1 rounded-lg border text-xs font-semibold transition flex items-center space-x-1 shadow-2xs cursor-pointer reocr-btn-resume"
                            :title="'繼續當前頁面的轉譯（快捷鍵: ' + modKeyLabel + '+P）'"
                        >
                            <i data-lucide="play" class="w-3 h-3"></i>
                            <span>繼續轉譯</span>
                        </button>
                    </template>

                    <!-- 升級模型組合 (upgrademodel 下拉選單 + 升級重新辨識按鈕) -->
                    <div class="flex items-center space-x-1.5 p-0.5 rounded-lg border border-indigo-200 bg-indigo-50/50 shadow-xs shrink-0">
                        <div class="relative inline-flex items-center pl-2">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-indigo-600 mr-1 shrink-0"></i>
                            <select 
                                name="upgrademodel" 
                                id="upgrademodel" 
                                x-model="upgradeModel" 
                                class="appearance-none bg-transparent pr-5 text-xs font-semibold text-indigo-900 focus:outline-none cursor-pointer max-w-[160px] sm:max-w-[210px] truncate py-0.5"
                                title="選擇升級模型"
                            >
                                <optgroup label="💎 付費 API 通道 (極速 1000 RPM · 專屬金鑰)" x-show="paidAccounts.length > 0">
                                    <template x-for="m in (paidAccounts.length > 0 ? modelsList : [])" :key="'paid_' + (m.id || m)">
                                        <option :value="'[PAID] ' + (m.id || m)" x-text="'💎 ' + (m.name || m.id || m)" :selected="upgradeModel === ('[PAID] ' + (m.id || m))"></option>
                                    </template>
                                </optgroup>
                                <optgroup :label="paidAccounts.length > 0 ? '🌿 免費 API 通道 (15 RPM 輪詢 · 0 元防護)' : '可用模型清單'">
                                    <template x-for="m in modelsList" :key="'free_' + (m.id || m)">
                                        <option :value="m.id || m" x-text="m.name || m.id || m" :selected="upgradeModel === (m.id || m)"></option>
                                    </template>
                                </optgroup>
                            </select>
                            <svg class="w-3.5 h-3.5 text-indigo-600 absolute right-1 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <button 
                            @click="retryWithUpgradeModel()" 
                            :disabled="isRetryingPage"
                            class="px-2.5 py-1 rounded-md bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium transition flex items-center space-x-1 shadow-xs shrink-0 cursor-pointer"
                            :class="{'opacity-50 cursor-not-allowed': isRetryingPage}"
                            :title="'使用所選的 API 通道重新辨識本頁（快捷鍵: ' + modKeyLabel + '+U）'"
                        >
                            <i data-lucide="zap" class="w-3 h-3 text-amber-300" :class="{'animate-spin': isRetryingPage && isRetryingUpgrade}"></i>
                            <span x-text="currentPage?.status === 'processing' && isRetryingUpgrade ? '升級中 (點擊重試)' : '升級重新辨識'"></span>
                            <kbd class="text-[10px] text-indigo-200 font-mono hidden sm:inline ml-0.5"
                                 x-text="modKeyLabel + '+U'">Alt+U</kbd>
                        </button>
                    </div>

                    <!-- 佇列快捷按鈕 -->
                    <button 
                        @click="toggleQueueModal()" 
                        class="px-2.5 py-1 rounded-lg border text-xs font-medium transition flex items-center space-x-1 shadow-xs shrink-0 cursor-pointer reocr-toolbar-btn"
                        :title="'查看重新辨識與升級佇列 (快捷鍵: ' + modKeyLabel + '+Q 或 Q)'"
                    >
                        <i data-lucide="layers" class="w-3.5 h-3.5 text-indigo-600"></i>
                        <span>重辨佇列</span>
                        <template x-if="activeReocrCount > 0">
                            <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                        </template>
                        <span class="px-1.5 py-0.2 rounded-full text-[10px] font-bold"
                              :class="activeReocrCount > 0 ? 'bg-indigo-600 text-white animate-pulse' : (failedReocrCount > 0 ? 'bg-rose-600 text-white' : 'reocr-count-badge')"
                              x-text="reocrQueue.length">0</span>
                        <kbd class="text-[10px] font-mono hidden sm:inline ml-0.5">Q</kbd>
                    </button>

                    <!-- 儲存修改按鈕 -->
                    <button @click="saveCurrentPageText()" class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition flex items-center space-x-1 shadow-sm shrink-0"
                            :title="'儲存修改 (快速鍵: ' + saveKeyLabel + ')'">
                        <i data-lucide="save" class="w-3.5 h-3.5"></i>
                        <span>儲存修改</span>
                        <kbd class="text-[10px] text-emerald-100 font-mono hidden sm:inline ml-0.5"
                             x-text="saveKeyLabel">Ctrl+S</kbd>
                    </button>
                </div>
            </div>

            <!-- Left Image & Right Editor Workspace -->
            <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-slate-200 min-h-[550px] flex-1">
                
                <!-- Left: Rendered PDF Page Image -->
                <div class="p-6 bg-slate-100/60 flex flex-col items-center justify-center overflow-auto custom-scroll max-h-[750px]">
                    <template x-if="currentPage && currentPage.image_url">
                        <div class="relative max-w-full shadow-lg rounded-lg border border-slate-300 overflow-hidden bg-white">
                            <img :src="currentPage.image_url" :alt="`Page ${currentPage.page_num}`" class="max-w-full h-auto object-contain">
                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white text-[11px] px-2 py-0.5 rounded">
                                原文 PDF 渲染圖 (300 DPI)
                            </div>
                        </div>
                    </template>
                    <template x-if="!currentPage">
                        <div class="text-center text-slate-400 py-12">
                            <i data-lucide="image" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                            <p class="text-sm">請選擇上方頁碼預覽</p>
                        </div>
                    </template>
                </div>

                <!-- Right: OCR Editable Text Area -->
                <div class="p-6 flex flex-col bg-white">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">OCR 轉譯結果（可直接編輯修正）</span>
                        <span class="text-xs text-slate-400" x-show="currentPage?.duration_seconds" x-text="`辨識耗時: ${currentPage?.duration_seconds}s`"></span>
                    </div>

                    <!-- Error Alert if any -->
                    <div x-show="currentPage?.status === 'failed'" class="p-3 mb-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700 flex items-start space-x-2">
                        <i data-lucide="alert-circle" class="w-4 h-4 text-red-500 shrink-0 mt-0.5"></i>
                        <div class="flex-1" x-text="currentPage?.error_message"></div>
                    </div>

                    <textarea 
                        x-model="currentPageText" 
                        placeholder="OCR 內容將即時顯示於此..."
                        class="flex-1 w-full p-4 text-sm font-mono border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 custom-scroll resize-none bg-slate-50/50 leading-relaxed"
                    ></textarea>
                </div>
            </div>
        </div>
