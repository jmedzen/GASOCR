    <!-- Application Script -->
    <script>
        function ocrApp() {
            return {
                currentTheme: localStorage.getItem('ocr_theme') || 'light',
                pendingFiles: [],
                allTasks: [],
                selectedTaskIds: [],
                isBatchDeleting: false,
                isPausingAll: false,
                isResumingAll: false,
                get hasActiveTasks() {
                    return this.allTasks && this.allTasks.some(t => ['processing', 'rendering', 'pending'].includes(t.status));
                },
                get hasPausedTasks() {
                    return this.allTasks && this.allTasks.some(t => ['paused', 'failed'].includes(t.status));
                },
                isSubmitting: false,
                uploadProgress: 0,
                get isCheckingAnyHash() {
                    return this.pendingFiles && this.pendingFiles.some(f => f.isCheckingHash);
                },
                get pendingCheckingCount() {
                    return this.pendingFiles ? this.pendingFiles.filter(f => f.isCheckingHash).length : 0;
                },
                formConfig: {
                    model: '{{ default_model | default("gemini-3.5-flash-lite") }}',
                    lang: 'traditional',
                    direction: 'auto',
                    column: 'auto',
                    customPrompt: '',
                    startPage: 1,
                    endPage: 0,
                    usePaidModel: false,
                    paidAccountId: null
                },
                showQuickPaidInput: false,
                quickPaidKeyName: '',
                quickPaidKey: '',
                isSubmittingQuickKey: false,
                modelsList: {{ models | tojson }},
                isLoadingModels: false,
                accounts: [],
                showAccountsModal: false,
                showQueueModal: false,
                // Quota Exhaustion & Countdown State
                quotaStatus: {
                    all_free_exhausted: false,
                    free_accounts_count: 0,
                    consecutive_counts: {},
                    reset_info: null
                },
                showQuotaModal: false,
                quotaCountdownText: '--:--:--',
                quotaRemainingFormatted: '--',
                quotaRemainingSeconds: 0,
                quotaTickerId: null,
                // Auth & Admin State
                authStatus: {
                    admin_initialized: true,
                    access_gate_enabled: false,
                    has_access_password: false,
                    is_admin: false,
                    is_authenticated_user: true
                },
                showAdminModal: false,
                showAdminLoginModal: false,
                showSetupWizardModal: false,
                adminTab: 'access_gate',
                setupWizard: {
                    password: '',
                    confirmPassword: '',
                    error: '',
                    isLoading: false
                },
                accessGateLock: {
                    password: '',
                    error: '',
                    isLoading: false
                },
                adminLogin: {
                    password: '',
                    error: '',
                    isLoading: false
                },
                adminSettings: {
                    access_gate_enabled: false,
                    has_access_password: false,
                    access_password: '',
                    confirm_access_password: '',
                    stats: {
                        total_accounts: 0,
                        active_accounts: 0,
                        total_tasks: 0,
                        completed_tasks: 0
                    },
                    isLoading: false,
                    error: '',
                    successMsg: ''
                },
                adminChangePassword: {
                    old_password: '',
                    new_password: '',
                    confirm_new_password: '',
                    isLoading: false,
                    error: '',
                    successMsg: ''
                },
                reocrQueue: (function() {
                    try {
                        const raw = JSON.parse(localStorage.getItem('gasocr_reocr_queue') || '[]');
                        const seen = new Set();
                        return raw.filter(j => {
                            const key = `${j.taskId}_${j.pageNum}`;
                            if (seen.has(key)) return false;
                            seen.add(key);
                            return true;
                        });
                    } catch (e) {
                        return [];
                    }
                })(),
                reocrFilter: 'all',
                toastMessage: '',
                toastTimeout: null,
                authTab: 'api_key',
                newKey: { name: '', api_key: '', is_paid: false },
                newOAuth: { name: '', client_id: '', client_secret: '', refresh_token: '' },
                webRpaConfig: {
                    enabled: true,
                    target_service: 'gemini',
                    browser_mode: 'cdp',
                    cdp_port: 9222,
                    cdp_user_data_dir: 'data/chrome_profile_rpa',
                    headless: true,
                    timeout_seconds: 60,
                    chrome_path: '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome',
                    supported_models: ['gemini-3.7-flash', 'gemini-3.8-flash', 'gemini-3.5-flash', 'gemini-2.5-pro', 'gemini-3-pro-preview']
                },
                cdpStatus: {
                    available: false,
                    logged_in: false,
                    checking: false,
                    connecting: false,
                    command: '',
                    endpoint: 'http://127.0.0.1:9222',
                    message: ''
                },
                webRpaStatus: {
                    logged_in: false,
                    loading: false,
                    launching: false,
                    saving: false,
                    verifying: false,
                    message: ''
                },
                isTestingWebRpa: false,
                
                // Active task state
                currentTaskId: null,
                currentTask: null,
                pages: [],
                selectedPageNum: 1,
                currentPageText: '',
                eventSource: null,
                isRetryingPage: false,
                isRetryingUpgrade: false,
                upgradeModel: 'gemini-2.5-pro',
                liveAvgSpeed: 0,
                liveEtaSeconds: 0,
                liveActivePage: null,
                liveActiveMsg: '',
                formatEta(seconds) {
                    if (!seconds || seconds <= 0) return '即將完成';
                    if (seconds < 60) return `約 ${seconds} 秒`;
                    const m = Math.floor(seconds / 60);
                    const s = seconds % 60;
                    return `約 ${m} 分 ${s} 秒`;
                },
                setTheme(theme) {
                    this.currentTheme = theme;
                    localStorage.setItem('ocr_theme', theme);
                    document.documentElement.classList.remove('theme-light', 'theme-dark', 'theme-gruvbox');
                    document.documentElement.classList.add('theme-' + theme);
                    document.body.classList.remove('theme-light', 'theme-dark', 'theme-gruvbox');
                    document.body.classList.add('theme-' + theme);
                },

                get paidAccounts() {
                    return this.accounts.filter(a => a.is_paid === 1);
                },
                get freeAccounts() {
                    return this.accounts.filter(a => !a.is_paid);
                },
                get activeAccountsCount() {
                    return this.accounts.filter(a => a.is_active && !a.is_paid).length;
                },
                get activePaidAccountsCount() {
                    return this.accounts.filter(a => a.is_active && a.is_paid === 1).length;
                },

                // ── Web RPA 狀態：依瀏覽器模式給出正確的判讀 ──
                // ── 平台判斷（快捷鍵提示文字用）──
                get isMacPlatform() {
                    const ua = navigator.userAgent || '';
                    return /Mac|iPhone|iPad|iPod/i.test(ua);
                },
                // macOS 顯示 ⌥，其他平台顯示 Alt
                get modKeyLabel() { return this.isMacPlatform ? '⌥' : 'Alt'; },
                get saveKeyLabel() { return this.isMacPlatform ? '⌘S' : 'Ctrl+S'; },
                get pageUpKeyLabel() { return this.isMacPlatform ? 'Fn+↑' : 'PageUp'; },
                get pageDownKeyLabel() { return this.isMacPlatform ? 'Fn+↓' : 'PageDown'; },

                get isCdpMode() {
                    return (this.webRpaConfig.browser_mode || 'cdp') === 'cdp';
                },

                get webRpaReady() {
                    return this.isCdpMode ? !!this.cdpStatus.logged_in : !!this.webRpaStatus.logged_in;
                },

                get webRpaHeadline() {
                    if (this.isCdpMode) {
                        if (this.cdpStatus.logged_in) return '✅ 已接入並登入';
                        if (this.cdpStatus.available) return '⚠️ 已找到 Chrome，尚未驗證';
                        return '⚠️ 尚未開啟 Chrome';
                    }
                    return this.webRpaStatus.logged_in ? '✅ Cookie 有效，就緒' : '⚠️ 尚未登入';
                },

                get webRpaStatusMessage() {
                    if (this.isCdpMode) {
                        return this.cdpStatus.message
                            || '請先執行 ./start_chrome_cdp.sh 開啟 Chrome 並手動登入，再點「檢查 CDP 連線」。';
                    }
                    return this.webRpaStatus.message || '請完成下方登入流程以啟用 [Web] 模型。';
                },

                get activeReocrCount() {
                    return this.reocrQueue.filter(j => j.status === 'processing').length;
                },

                get completedReocrCount() {
                    return this.reocrQueue.filter(j => j.status === 'completed').length;
                },

                get pausedReocrCount() {
                    return this.reocrQueue.filter(j => j.status === 'paused').length;
                },

                get failedReocrCount() {
                    return this.reocrQueue.filter(j => j.status === 'failed').length;
                },

                get filteredReocrQueue() {
                    if (this.reocrFilter === 'processing') {
                        return this.reocrQueue.filter(j => j.status === 'processing');
                    }
                    if (this.reocrFilter === 'paused') {
                        return this.reocrQueue.filter(j => j.status === 'paused');
                    }
                    if (this.reocrFilter === 'completed') {
                        return this.reocrQueue.filter(j => j.status === 'completed');
                    }
                    if (this.reocrFilter === 'failed') {
                        return this.reocrQueue.filter(j => j.status === 'failed');
                    }
                    return this.reocrQueue;
                },

                get progressPercent() {
                    if (!this.currentTask || !this.currentTask.total_pages) return 0;
                    if (this.currentTask.status === 'rendering') {
                        const rendered = this.currentTask.rendered_pages || 0;
                        return Math.min(100, Math.round((rendered / this.currentTask.total_pages) * 100));
                    }
                    return Math.min(100, Math.round(((this.currentTask.processed_pages || 0) / this.currentTask.total_pages) * 100));
                },

                get currentPage() {
                    return this.pages.find(p => p.page_num === this.selectedPageNum) || null;
                },

                get isFirstPage() {
                    if (!this.pages || this.pages.length === 0) return true;
                    return this.selectedPageNum === this.pages[0].page_num;
                },

                get isLastPage() {
                    if (!this.pages || this.pages.length === 0) return true;
                    return this.selectedPageNum === this.pages[this.pages.length - 1].page_num;
                },

                async initApp() {
                    this.setTheme(this.currentTheme);
                    await this.checkAuthStatus();
                    if (this.authStatus.is_authenticated_user) {
                        this.postUnlockInit();
                    }
                    // 週期性檢查任務狀態 (2秒輪詢一次，讓批次多任務進行時進度條絲滑更新)
                    setInterval(() => {
                        if (this.authStatus.is_authenticated_user && this.allTasks.some(t => ['rendering', 'processing', 'pending'].includes(t.status))) {
                            this.loadTasks();
                        }
                    }, 2000);
                    // 週期性檢查重辨佇列中執行中任務的狀態
                    setInterval(() => {
                        if (this.authStatus.is_authenticated_user && this.activeReocrCount > 0) {
                            this.checkActiveReocrJobs();
                        }
                    }, 2000);
                    // 週期性檢查免費配額耗盡與重置狀態
                    setInterval(() => {
                        if (this.authStatus.is_authenticated_user) {
                            this.checkQuotaStatus();
                        }
                    }, 5000);
                    // 全域快速鍵監聽（佇列開關、校對翻頁、儲存、重辨）
                    window.addEventListener('keydown', (e) => {
                        this.handleKeyDown(e);
                    });
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                postUnlockInit() {
                    this.loadAccounts();
                    this.loadWebRpaConfig();
                    this.loadTasks();
                    this.refreshModels(false);
                    this.checkQuotaStatus();
                    this.startQuotaTicker();
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                async checkAuthStatus() {
                    try {
                        const res = await fetch('/api/auth/status');
                        if (res.ok) {
                            this.authStatus = await res.json();
                            if (!this.authStatus.admin_initialized || (this.authStatus.access_gate_enabled && !this.authStatus.is_authenticated_user)) {
                                window.location.reload();
                                return;
                            }
                        }
                    } catch (e) {
                        console.error('Failed to fetch auth status:', e);
                    } finally {
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async submitSetupWizard() {
                    this.setupWizard.error = '';
                    if (!this.setupWizard.password || this.setupWizard.password.length < 4) {
                        this.setupWizard.error = '管理員密碼長度至少需 4 個字元';
                        return;
                    }
                    if (this.setupWizard.password !== this.setupWizard.confirmPassword) {
                        this.setupWizard.error = '兩次輸入的密碼不一致';
                        return;
                    }
                    this.setupWizard.isLoading = true;
                    try {
                        const res = await fetch('/api/admin/init', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: this.setupWizard.password })
                        });
                        const data = await res.json();
                        if (res.ok && data.success) {
                            this.showSetupWizardModal = false;
                            this.showToast('🎉 管理員密碼設定成功！');
                            await this.checkAuthStatus();
                            this.postUnlockInit();
                        } else {
                            this.setupWizard.error = data.detail || '初始化失敗';
                        }
                    } catch (e) {
                        this.setupWizard.error = String(e);
                    } finally {
                        this.setupWizard.isLoading = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async submitAccessUnlock() {
                    this.accessGateLock.error = '';
                    if (!this.accessGateLock.password) {
                        this.accessGateLock.error = '請輸入通關密碼';
                        return;
                    }
                    this.accessGateLock.isLoading = true;
                    try {
                        const res = await fetch('/api/auth/verify-access', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: this.accessGateLock.password })
                        });
                        const data = await res.json();
                        if (res.ok && data.success) {
                            this.accessGateLock.password = '';
                            this.showToast(data.message || '🔓 通關成功！');
                            await this.checkAuthStatus();
                            this.postUnlockInit();
                        } else {
                            this.accessGateLock.error = data.detail || '通關密碼錯誤，請重新輸入';
                        }
                    } catch (e) {
                        this.accessGateLock.error = String(e);
                    } finally {
                        this.accessGateLock.isLoading = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                openAdminModal() {
                    if (this.authStatus.is_admin) {
                        this.loadAdminSettings();
                        this.showAdminModal = true;
                    } else {
                        this.adminLogin.password = '';
                        this.adminLogin.error = '';
                        this.showAdminLoginModal = true;
                    }
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                async submitAdminLogin() {
                    this.adminLogin.error = '';
                    if (!this.adminLogin.password) {
                        this.adminLogin.error = '請輸入管理員密碼';
                        return;
                    }
                    this.adminLogin.isLoading = true;
                    try {
                        const res = await fetch('/api/admin/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: this.adminLogin.password })
                        });
                        const data = await res.json();
                        if (res.ok && data.success) {
                            this.adminLogin.password = '';
                            this.showAdminLoginModal = false;
                            this.showToast('🔑 管理員登入成功');
                            await this.checkAuthStatus();
                            this.loadAdminSettings();
                            this.showAdminModal = true;
                            this.postUnlockInit();
                        } else {
                            this.adminLogin.error = data.detail || '管理員密碼錯誤';
                        }
                    } catch (e) {
                        this.adminLogin.error = String(e);
                    } finally {
                        this.adminLogin.isLoading = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async loadAdminSettings() {
                    this.adminSettings.isLoading = true;
                    this.adminSettings.error = '';
                    this.adminSettings.successMsg = '';
                    try {
                        const res = await fetch('/api/admin/settings');
                        if (res.ok) {
                            const data = await res.json();
                            this.adminSettings.access_gate_enabled = data.access_gate_enabled;
                            this.adminSettings.has_access_password = data.has_access_password;
                            if (data.stats) {
                                this.adminSettings.stats = data.stats;
                            }
                        } else if (res.status === 401) {
                            this.authStatus.is_admin = false;
                            this.showAdminModal = false;
                            this.showToast('⚠️ 管理員授權已過期，請重新登入');
                        }
                    } catch (e) {
                        this.adminSettings.error = String(e);
                    } finally {
                        this.adminSettings.isLoading = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async saveAccessGateSetting() {
                    this.adminSettings.error = '';
                    this.adminSettings.successMsg = '';
                    
                    if (this.adminSettings.access_password) {
                        if (this.adminSettings.access_password !== this.adminSettings.confirm_access_password) {
                            this.adminSettings.error = '兩次輸入的通關密碼不一致';
                            return;
                        }
                    } else if (this.adminSettings.access_gate_enabled && !this.adminSettings.has_access_password) {
                        this.adminSettings.error = '啟用通關保護前，請先設定一組通關密碼';
                        return;
                    }
                    
                    this.adminSettings.isLoading = true;
                    try {
                        const payload = {
                            enabled: this.adminSettings.access_gate_enabled
                        };
                        if (this.adminSettings.access_password) {
                            payload.password = this.adminSettings.access_password;
                        }
                        const res = await fetch('/api/admin/settings/access-gate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        if (res.ok && data.success) {
                            this.adminSettings.successMsg = data.message;
                            this.adminSettings.access_password = '';
                            this.adminSettings.confirm_access_password = '';
                            this.adminSettings.has_access_password = data.has_access_password;
                            this.adminSettings.access_gate_enabled = data.access_gate_enabled;
                            this.authStatus.access_gate_enabled = data.access_gate_enabled;
                            this.showToast('✅ ' + data.message);
                        } else {
                            this.adminSettings.error = data.detail || '設定儲存失敗';
                        }
                    } catch (e) {
                        this.adminSettings.error = String(e);
                    } finally {
                        this.adminSettings.isLoading = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async submitChangeAdminPassword() {
                    this.adminChangePassword.error = '';
                    this.adminChangePassword.successMsg = '';
                    if (!this.adminChangePassword.old_password) {
                        this.adminChangePassword.error = '請輸入原管理員密碼';
                        return;
                    }
                    if (!this.adminChangePassword.new_password || this.adminChangePassword.new_password.length < 4) {
                        this.adminChangePassword.error = '新密碼長度至少需 4 個字元';
                        return;
                    }
                    if (this.adminChangePassword.new_password !== this.adminChangePassword.confirm_new_password) {
                        this.adminChangePassword.error = '兩次輸入的新密碼不一致';
                        return;
                    }
                    this.adminChangePassword.isLoading = true;
                    try {
                        const res = await fetch('/api/admin/change-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                old_password: this.adminChangePassword.old_password,
                                new_password: this.adminChangePassword.new_password
                            })
                        });
                        const data = await res.json();
                        if (res.ok && data.success) {
                            this.adminChangePassword.successMsg = data.message;
                            this.adminChangePassword.old_password = '';
                            this.adminChangePassword.new_password = '';
                            this.adminChangePassword.confirm_new_password = '';
                            this.showToast('🎉 ' + data.message);
                        } else {
                            this.adminChangePassword.error = data.detail || '密碼變更失敗';
                        }
                    } catch (e) {
                        this.adminChangePassword.error = String(e);
                    } finally {
                        this.adminChangePassword.isLoading = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async adminLogout() {
                    try {
                        await fetch('/api/admin/logout', { method: 'POST' });
                        this.authStatus.is_admin = false;
                        this.showAdminModal = false;
                        this.showToast('已登出管理員身分');
                        await this.checkAuthStatus();
                    } catch (e) {
                        console.error(e);
                    } finally {
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async reLockAccessGate() {
                    try {
                        await fetch('/api/auth/logout-access', { method: 'POST' });
                        window.location.reload();
                    } catch (e) {
                        console.error('Failed to relock access gate:', e);
                    }
                },

                async refreshModels(manual = false) {
                    this.isLoadingModels = true;
                    this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
                    try {
                        const res = await fetch(`/api/models?refresh=${manual}`);
                        const data = await res.json();
                        if (data.models && data.models.length > 0) {
                            this.modelsList = data.models;
                            if (!this.upgradeModel) {
                                const pro = this.modelsList.find(m => (m.id || m) === 'gemini-2.5-pro');
                                this.upgradeModel = pro ? (pro.id || pro) : (this.modelsList[0].id || this.modelsList[0]);
                            }
                            if (manual) {
                                if (data.updated) {
                                    this.showToast(`✅ ${data.message || `已成功更新 ${data.models.length} 個可用模型！`}`);
                                } else {
                                    this.showToast(`⚠️ ${data.message || '無法自 Google 取得最新模型，維持現有清單'}`);
                                }
                            }
                        } else if (manual) {
                            this.showToast(`⚠️ ${data.message || '未能取得可用模型清單'}`);
                        }
                    } catch (err) {
                        console.error('刷新模型清單失敗:', err);
                        if (manual) this.showToast('⚠️ 刷新模型清單失敗: ' + (err.message || err));
                    } finally {
                        this.isLoadingModels = false;
                        this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
                    }
                },

                async addPendingFiles(files) {
                    const validPdfs = files.filter(f => f.name && f.name.toLowerCase().endsWith('.pdf'));
                    if (validPdfs.length === 0) {
                        this.showToast('⚠️ 請選擇有效的 PDF 檔案！');
                        return;
                    }

                    const newItems = [];
                    for (const f of validPdfs) {
                        const fileId = 'f_' + Math.random().toString(36).slice(2, 9) + '_' + Date.now();
                        const item = {
                            id: fileId,
                            file: f,
                            name: f.name,
                            size: f.size,
                            hash: '',
                            isCheckingHash: true,
                            isCached: false,
                            cachedPath: ''
                        };
                        newItems.push(item);
                        this.pendingFiles.push(item);
                    }
                    this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });

                    // 採用佇列排程，一次只處理 1 個檔案的 SHA-256。
                    // crypto.subtle.digest 不支援串流，必須先把整個檔案讀成 ArrayBuffer
                    // （使用者的 PDF 單檔可達 250MB），因此並行 2 個就會同時佔用 500MB+
                    // 的瀏覽器記憶體，容易讓分頁卡死或崩潰。序列化最保險。
                    const queue = [...newItems];
                    const processItem = async (item) => {
                        const f = item.file;
                        let calculatedHash = '';
                        let isCached = false;
                        let cachedPath = '';
                        try {
                            if (window.crypto && window.crypto.subtle) {
                                const arrayBuffer = await f.arrayBuffer();
                                const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
                                const hashArray = Array.from(new Uint8Array(hashBuffer));
                                calculatedHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                            }
                            
                            if (calculatedHash) {
                                const res = await fetch('/api/files/check-hash', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ hash: calculatedHash, filename: f.name, size: f.size })
                                });
                                if (res.ok) {
                                    const data = await res.json();
                                    if (data.exists) {
                                        isCached = true;
                                        cachedPath = data.filepath;
                                    }
                                }
                            }
                        } catch (e) {
                            console.error('Hash check error for ' + f.name + ':', e);
                        } finally {
                            const target = this.pendingFiles.find(p => p.id === item.id);
                            if (target) {
                                target.hash = calculatedHash;
                                target.isCached = isCached;
                                target.cachedPath = cachedPath;
                                target.isCheckingHash = false;
                            }
                            this.pendingFiles = [...this.pendingFiles];
                            this.$nextTick(() => { 
                                if (window.lucide) lucide.createIcons(); 
                            });
                        }
                    };

                    const maxWorkers = 1;
                    const workers = Array.from({ length: Math.min(maxWorkers, queue.length) }, async () => {
                        while (queue.length > 0) {
                            const nextItem = queue.shift();
                            if (nextItem) {
                                await processItem(nextItem);
                            }
                        }
                    });
                    await Promise.all(workers);
                },

                    const files = Array.from(event.target.files);
                    this.addPendingFiles(files);
                    event.target.value = '';

                formatFileSize(bytes) {
                    if (!bytes) return '0 B';
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                },
