                async startBatchOcrTask() {
                    if (this.pendingFiles.length === 0) return;
                    if (this.formConfig.usePaidModel && this.paidAccounts.length === 0) {
                        alert('您已勾選「💎 使用付費 API」，但目前尚未設定任何付費金鑰。\n請先於下方快速輸入您的付費 API Key，或取消勾選以使用免費 API 金鑰池。');
                        this.showQuickPaidInput = true;
                        return;
                    }
                    this.isSubmitting = true;
                    this.uploadProgress = 0;

                    // ── 大檔切片分塊上傳 (Chunked Upload) 與小檔分批防爆設定 ─────────
                    // Cloudflare Free/Pro 嚴格限制單一 POST 請求 Body 上限為 100MB，
                    // 若直接上傳 200MB+ 的 PDF，Cloudflare 會在到達後端前直接拒收並回傳 413 Payload Too Large。
                    // 解決方案：
                    // 1. > 30MB 的大型檔案一律使用 /api/upload/chunk 依 20MB 切片串流上傳，徹底避開 100MB 限制
                    // 2. 切片傳輸支援失敗重試 (3次)，完成後自動聚合並取得特徵碼，以 existing_files 形式建立任務
                    // 3. <= 30MB 的小型檔案維持標準快速上傳，每批次嚴格控制在 30MB 以內
                    const CHUNK_THRESHOLD = 30 * 1024 * 1024; // 30 MB
                    const CHUNK_SIZE = 20 * 1024 * 1024;      // 20 MB

                    const cachedItems = this.pendingFiles.filter(i => i.isCached && i.hash);
                    const newItems = this.pendingFiles.filter(i => !(i.isCached && i.hash));

                    // 分離大檔 (需切片) 與小檔 (可直接快速上傳)
                    const largeNewItems = newItems.filter(i => ((i.file && i.file.size) || 0) > CHUNK_THRESHOLD);
                    const smallNewItems = newItems.filter(i => ((i.file && i.file.size) || 0) <= CHUNK_THRESHOLD);

                    const smallBatches = [];
                    let cur = [];
                    let curBytes = 0;
                    for (const it of smallNewItems) {
                        const sz = (it.file && it.file.size) || 0;
                        const wouldExceed = cur.length > 0 &&
                            (cur.length >= 2 || curBytes + sz > CHUNK_THRESHOLD);
                        if (wouldExceed) {
                            smallBatches.push(cur);
                            cur = [];
                            curBytes = 0;
                        }
                        cur.push(it);
                        curBytes += sz;
                    }
                    if (cur.length > 0) smallBatches.push(cur);

                    const totalBytes = newItems.reduce((s, i) => s + ((i.file && i.file.size) || 0), 0);
                    let uploadedBytes = 0;
                    let totalCreated = 0;
                    let firstTaskId = null;
                    const failures = [];
                    const allReadyExistingFiles = cachedItems.map(i => ({
                        hash: i.hash,
                        filename: i.name,
                        filepath: i.cachedPath
                    }));

                    const buildFormData = (files, cached) => {
                        const fd = new FormData();
                        for (const it of files) {
                            fd.append('files', it.file || it);
                        }
                        if (cached && cached.length > 0) {
                            fd.append('existing_files', JSON.stringify(cached));
                        }
                        fd.append('model', this.formConfig.model);
                        fd.append('lang', this.formConfig.lang);
                        fd.append('direction', this.formConfig.direction);
                        fd.append('column', this.formConfig.column);
                        fd.append('custom_prompt', this.formConfig.customPrompt);
                        fd.append('start_page', this.formConfig.startPage || 1);
                        fd.append('end_page', this.formConfig.endPage || 0);
                        fd.append('use_paid_model', this.formConfig.usePaidModel ? 'true' : 'false');
                        if (this.formConfig.usePaidModel && this.formConfig.paidAccountId) {
                            fd.append('paid_account_id', this.formConfig.paidAccountId);
                        }
                        return fd;
                    };

                    const postBatch = (formData, batchBytes = 0) => new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', '/api/tasks');
                        xhr.timeout = 15 * 60 * 1000;
                        xhr.upload.onprogress = (e) => {
                            if (e.lengthComputable && e.total > 0) {
                                const denom = totalBytes > 0 ? totalBytes : 1;
                                const done = uploadedBytes + e.loaded;
                                this.uploadProgress = Math.min(99, Math.round((done / denom) * 100));
                            }
                        };
                        xhr.onload = () => {
                            try {
                                const data = JSON.parse(xhr.responseText);
                                resolve({ status: xhr.status, data });
                            } catch (err) {
                                if (xhr.status === 413) {
                                    reject(new Error('檔案過大，伺服器或反向代理 (Nginx/Cloudflare) 拒絕接收 (413 Payload Too Large)'));
                                } else {
                                    reject(new Error('伺服器回應格式錯誤: ' +
                                        (xhr.responseText ? xhr.responseText.slice(0, 100) : xhr.statusText)));
                                }
                            }
                        };
                        xhr.onerror = () => reject(new Error('網路傳輸失敗，請檢查連線狀態'));
                        xhr.ontimeout = () => reject(new Error('請求超時（15 分鐘），檔案過大或伺服器處理時間過長'));
                        xhr.send(formData);
                    });

                    const postChunk = (chunkFd, onProgress) => new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', '/api/upload/chunk');
                        xhr.timeout = 5 * 60 * 1000;
                        xhr.upload.onprogress = (e) => {
                            if (e.lengthComputable && onProgress) {
                                onProgress(e.loaded);
                            }
                        };
                        xhr.onload = () => {
                            try {
                                const data = JSON.parse(xhr.responseText);
                                if (xhr.status === 200) {
                                    resolve({ status: xhr.status, data });
                                } else {
                                    reject(new Error(data.detail || `HTTP ${xhr.status}`));
                                }
                            } catch (err) {
                                if (xhr.status === 413) {
                                    reject(new Error('分片超過邊界伺服器上限 (413 Payload Too Large)'));
                                } else {
                                    reject(new Error('伺服器回應格式錯誤: ' +
                                        (xhr.responseText ? xhr.responseText.slice(0, 100) : xhr.statusText)));
                                }
                            }
                        };
                        xhr.onerror = () => reject(new Error('分片網路傳輸失敗，請檢查連線狀態'));
                        xhr.ontimeout = () => reject(new Error('分片請求超時'));
                        xhr.send(chunkFd);
                    });

                    const absorb = (res, items) => {
                        if (res.status === 200 && res.data && res.data.status === 'ok') {
                            totalCreated += res.data.count || 0;
                            if (!firstTaskId) firstTaskId = res.data.task_id;
                            (res.data.failed || []).forEach(f => failures.push(f));
                        } else {
                            const m = (res.data && (res.data.detail || res.data.message)) || '未知原因';
                            items.forEach(it => failures.push({ name: it.name || it.filename, error: m }));
                        }
                    };

                    try {
                        // 1) 處理大檔案：以 20MB 分塊切片序列上傳，避開 Cloudflare 100MB 限制
                        for (const it of largeNewItems) {
                            const file = it.file;
                            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                            const uploadId = 'chunk_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
                            let fileSuccess = true;
                            let completedInfo = null;

                            for (let cIdx = 0; cIdx < totalChunks; cIdx++) {
                                const start = cIdx * CHUNK_SIZE;
                                const end = Math.min(file.size, start + CHUNK_SIZE);
                                const chunkBlob = file.slice(start, end);
                                const currentChunkBytes = end - start;

                                const cFd = new FormData();
                                cFd.append('upload_id', uploadId);
                                cFd.append('chunk_index', cIdx);
                                cFd.append('total_chunks', totalChunks);
                                cFd.append('filename', it.name);
                                cFd.append('chunk', chunkBlob, it.name);

                                let chunkDone = false;
                                let lastErr = null;
                                for (let attempt = 0; attempt < 3; attempt++) {
                                    try {
                                        const res = await postChunk(cFd, (loaded) => {
                                            const denom = totalBytes > 0 ? totalBytes : 1;
                                            const done = uploadedBytes + loaded;
                                            this.uploadProgress = Math.min(99, Math.round((done / denom) * 100));
                                        });
                                        chunkDone = true;
                                        if (cIdx === totalChunks - 1) {
                                            completedInfo = res.data;
                                        }
                                        break;
                                    } catch (err) {
                                        lastErr = err;
                                        await new Promise(r => setTimeout(r, 1000));
                                    }
                                }

                                if (!chunkDone) {
                                    failures.push({
                                        name: it.name,
                                        error: `分片 ${cIdx + 1}/${totalChunks} 上傳失敗: ` + (lastErr?.message || lastErr)
                                    });
                                    fileSuccess = false;
                                    break;
                                }
                                uploadedBytes += currentChunkBytes;
                            }

                            if (fileSuccess && completedInfo) {
                                allReadyExistingFiles.push({
                                    hash: completedInfo.file_hash,
                                    filename: it.name,
                                    filepath: completedInfo.filepath
                                });
                            }
                        }

                        // 2) 提交所有已就緒檔案（包含伺服器原快取與剛剛完成切片上傳的大檔）
                        if (allReadyExistingFiles.length > 0) {
                            try {
                                absorb(await postBatch(buildFormData([], allReadyExistingFiles)), allReadyExistingFiles);
                            } catch (err) {
                                allReadyExistingFiles.forEach(it => failures.push({
                                    name: it.name || it.filename, error: err.message || String(err)
                                }));
                            }
                        }

                        // 3) 處理 <= 30MB 的小型新檔案（以每批 <= 30MB 序列上傳）
                        for (const batch of smallBatches) {
                            const bytesInBatch = batch.reduce(
                                (s, it) => s + ((it.file && it.file.size) || 0), 0);
                            try {
                                absorb(await postBatch(buildFormData(batch, []), bytesInBatch), batch);
                            } catch (err) {
                                batch.forEach(it => failures.push({
                                    name: it.name, error: err.message || String(err)
                                }));
                            }
                            uploadedBytes += bytesInBatch;
                        }

                        this.uploadProgress = 100;

                        if (totalCreated > 0) {
                            // 只把失敗的檔案留在佇列，方便直接重試
                            const failedNames = new Set(failures.map(f => f.name));
                            this.pendingFiles = this.pendingFiles.filter(p => failedNames.has(p.name));
                            await this.loadTasks();
                            if (firstTaskId) {
                                const firstTask = this.allTasks.find(t => t.id === firstTaskId);
                                if (firstTask) this.inspectTask(firstTask);
                            }
                            let msg = `🎉 已成功排入 ${totalCreated} 個檔案進行批次 OCR 轉譯！`;
                            if (failures.length > 0) msg += ` （${failures.length} 個失敗，已保留在清單中可重試）`;
                            this.showToast(msg);
                            if (failures.length > 0) {
                                alert('⚠️ 部分檔案未排入：\n\n' +
                                    failures.slice(0, 10).map(f => `• ${f.name}\n  ${f.error}`).join('\n\n'));
                            }
                        } else {
                            const detail = failures.length > 0
                                ? failures.slice(0, 5).map(f => `${f.name}: ${f.error}`).join('\n')
                                : '未知原因';
                            this.showToast('⚠️ 啟動任務失敗');
                            alert('⚠️ 沒有檔案成功排入：\n\n' + detail);
                        }
                    } catch (err) {
                        this.showToast('⚠️ 送出任務錯誤: ' + (err.message || err));
                    } finally {
                        this.isSubmitting = false;
                        this.uploadProgress = 0;
                        this.$nextTick(() => { 
                            if (window.lucide) lucide.createIcons(); 
                        });
                    }
                },

                inspectTask(task) {
                    // 立即關閉先前的 SSE 連線，防止背景舊任務事件污染當前校對任務
                    if (this.eventSource) {
                        this.eventSource.close();
                        this.eventSource = null;
                    }
                    this.currentTaskId = task.id;
                    this.currentTask = { ...task };
                    this.selectedPageNum = null;
                    this.liveAvgSpeed = 0;
                    this.liveEtaSeconds = 0;
                    this.liveActivePage = null;
                    this.liveActiveMsg = '';
                    this.pollTaskDetail();
                    if (['processing', 'rendering', 'pending'].includes(task.status)) {
                        this.listenTaskEvents(task.id);
                    }
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                async toggleTaskPause(task) {
                    if (!task) return;
                    const isResuming = ['paused', 'failed'].includes(task.status);
                    const action = isResuming ? 'resume' : 'pause';
                    const fetchOpts = { method: 'POST' };
                    if (isResuming && task.model) {
                        fetchOpts.headers = { 'Content-Type': 'application/json' };
                        fetchOpts.body = JSON.stringify({ model: task.model });
                    }
                    try {
                        const res = await fetch(`/api/tasks/${task.id}/${action}`, fetchOpts);
                        if (res.ok) {
                            const data = await res.json();
                            task.status = data.task_status;
                            if (data.model) task.model = data.model;

                            const row = this.allTasks.find(t => t.id === task.id);
                            if (row) {
                                row.status = data.task_status;
                                if (data.model) row.model = data.model;
                            }

                            if (this.currentTask && this.currentTask.id === task.id) {
                                this.currentTask.status = data.task_status;
                                if (data.model) this.currentTask.model = data.model;
                                if (action === 'resume') {
                                    this.listenTaskEvents(task.id);
                                } else if (action === 'pause') {
                                    if (this.eventSource) {
                                        this.eventSource.close();
                                        this.eventSource = null;
                                    }
                                }
                            }
                            await this.loadTasks();
                            this.showToast(action === 'pause' ? '⏸️ 任務已暫停（已即時停止切圖與 OCR）' : '▶️ 任務已接續執行');
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            this.showToast(`⚠️ 操作失敗: ${errData.detail || res.statusText}`);
                        }
                    } catch (err) {
                        this.showToast(`⚠️ 操作失敗: ${err.message || err}`);
                    }
                },

                async changeTaskModel(task) {
                    if (!task || !task.model) return;
                    try {
                        const res = await fetch(`/api/tasks/${task.id}/model`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ model: task.model })
                        });
                        if (res.ok) {
                            if (this.currentTask && this.currentTask.id === task.id) {
                                this.currentTask.model = task.model;
                            }
                            const match = this.allTasks.find(t => t.id === task.id);
                            if (match) match.model = task.model;
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            console.error('更新模型失敗:', errData);
                        }
                    } catch (err) {
                        console.error('更新任務模型網路錯誤:', err);
                    }
                },

                toggleSelectAllTasks() {
                    if (this.allTasks.length > 0 && this.selectedTaskIds.length === this.allTasks.length) {
                        this.selectedTaskIds = [];
                    } else {
                        this.selectedTaskIds = this.allTasks.map(t => t.id);
                    }
                },

                async deleteTask(taskId) {
                    if (!confirm('確定要刪除此轉譯任務與相關檔案嗎？')) return;
                    try {
                        const res = await fetch(`/api/tasks/${taskId}`, { method: 'DELETE' });
                        if (res.ok) {
                            if (this.currentTaskId === taskId) {
                                if (this.eventSource) {
                                    this.eventSource.close();
                                    this.eventSource = null;
                                }
                                this.currentTaskId = null;
                                this.currentTask = null;
                                this.pages = [];
                                this.selectedPageNum = null;
                            }
                            this.selectedTaskIds = this.selectedTaskIds.filter(id => id !== taskId);
                            // 同步自重辨佇列中移除已刪除任務的項目
                            this.reocrQueue = this.reocrQueue.filter(j => j.taskId !== taskId);
                            this.saveReocrQueue();
                            await this.loadTasks();
                        }
                    } catch (err) {
                        alert('刪除失敗: ' + err);
                    }
                },

                async deleteSelectedTasks() {
                    const count = this.selectedTaskIds.length;
                    if (count === 0) return;
                    
                    const runningCount = this.allTasks.filter(t => this.selectedTaskIds.includes(t.id) && ['processing', 'rendering', 'pending'].includes(t.status)).length;
                    let confirmMsg = `確定要批次刪除選取的 ${count} 個轉譯任務嗎？\n此動作將一併刪除相關切圖快取與成果且無法復原。`;
                    if (runningCount > 0) {
                        confirmMsg += `\n⚠️ 提醒：其中包含 ${runningCount} 個正在轉譯中的任務，刪除將會強制中止執行。`;
                    }
                    
                    if (!confirm(confirmMsg)) return;
                    
                    this.isBatchDeleting = true;
                    try {
                        const res = await fetch('/api/tasks/batch-delete', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ task_ids: this.selectedTaskIds })
                        });
                        const data = await res.json().catch(() => ({}));
                        if (res.ok) {
                            if (this.currentTaskId && this.selectedTaskIds.includes(this.currentTaskId)) {
                                if (this.eventSource) {
                                    this.eventSource.close();
                                    this.eventSource = null;
                                }
                                this.currentTaskId = null;
                                this.currentTask = null;
                                this.pages = [];
                                this.selectedPageNum = null;
                            }
                            const deletedSet = new Set(this.selectedTaskIds);
                            // 同步自重辨佇列中移除已批次刪除任務的項目
                            this.reocrQueue = this.reocrQueue.filter(j => !deletedSet.has(j.taskId));
                            this.saveReocrQueue();
                            this.selectedTaskIds = [];
                            await this.loadTasks();
                            alert(`🎉 已成功刪除 ${data.deleted_count || count} 個任務！`);
                        } else {
                            alert('批次刪除失敗: ' + (data.detail || '伺服器異常'));
                        }
                    } catch (err) {
                        alert('批次刪除請求錯誤: ' + err);
                    } finally {
                        this.isBatchDeleting = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async pauseAllTasks(taskIds = null) {
                    const isSelective = Array.isArray(taskIds) && taskIds.length > 0;
                    this.isPausingAll = true;
                    try {
                        const payload = isSelective ? { task_ids: taskIds } : {};
                        const res = await fetch('/api/tasks/pause-all', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json().catch(() => ({}));
                        if (res.ok) {
                            await this.loadTasks();
                            if (this.currentTaskId && data.task_ids && data.task_ids.includes(this.currentTaskId)) {
                                if (this.currentTask) this.currentTask.status = 'paused';
                                if (this.eventSource) {
                                    this.eventSource.close();
                                    this.eventSource = null;
                                }
                            }
                            if (data.task_ids && Array.isArray(data.task_ids)) {
                                let queueChanged = false;
                                for (const job of this.reocrQueue) {
                                    if (data.task_ids.includes(job.taskId) && job.status === 'processing') {
                                        job.status = 'paused';
                                        job.error = '已隨任務暫停';
                                        queueChanged = true;
                                    }
                                }
                                if (queueChanged) this.saveReocrQueue();
                            }
                            const count = data.paused_count || 0;
                            this.showToast(`⏸️ 已成功暫停 ${count} 個任務（已停止切圖與 OCR）`);
                        } else {
                            this.showToast(`⚠️ 全部暫停失敗: ${data.detail || res.statusText}`);
                        }
                    } catch (err) {
                        this.showToast(`⚠️ 全部暫停異常: ${err.message || err}`);
                    } finally {
                        this.isPausingAll = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async resumeAllTasks(taskIds = null) {
                    const isSelective = Array.isArray(taskIds) && taskIds.length > 0;
                    this.isResumingAll = true;
                    try {
                        const payload = isSelective ? { task_ids: taskIds } : {};
                        const res = await fetch('/api/tasks/resume-all', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json().catch(() => ({}));
                        if (res.ok) {
                            await this.loadTasks();
                            if (this.currentTaskId && data.task_ids && data.task_ids.includes(this.currentTaskId)) {
                                const found = this.allTasks.find(t => t.id === this.currentTaskId);
                                if (this.currentTask && found) this.currentTask.status = found.status;
                                this.listenTaskEvents(this.currentTaskId);
                            }
                            const count = data.resumed_count || 0;
                            this.showToast(`▶️ 已成功接續執行 ${count} 個任務`);
                        } else {
                            this.showToast(`⚠️ 全部繼續失敗: ${data.detail || res.statusText}`);
                        }
                    } catch (err) {
                        this.showToast(`⚠️ 全部繼續異常: ${err.message || err}`);
                    } finally {
                        this.isResumingAll = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async pauseSelectedTasks() {
                    if (this.selectedTaskIds.length === 0) return;
                    await this.pauseAllTasks(this.selectedTaskIds);
                },

                async resumeSelectedTasks() {
                    if (this.selectedTaskIds.length === 0) return;
                    await this.resumeAllTasks(this.selectedTaskIds);
                },

                // --- Google AI Studio Free Quota Tracking & Alert Methods ---

                async checkQuotaStatus() {
                    try {
                        const res = await fetch('/api/quota/status');
                        if (res.ok) {
                            const data = await res.json();
                            const prevExhausted = this.quotaStatus.all_free_exhausted;
                            this.quotaStatus = data;
                            this.updateQuotaCountdown();

                            // 若首度轉為耗盡狀態，自動彈窗提示
                            if (data.all_free_exhausted && !prevExhausted) {
                                this.openQuotaModal();
                            }
                        }
                    } catch (e) {
                        console.error('Failed to fetch quota status:', e);
                    }
                },

                updateQuotaCountdown() {
                    if (!this.quotaStatus || !this.quotaStatus.reset_info) return;
                    const info = this.quotaStatus.reset_info;
                    let remaining = 0;
                    if (info.reset_timestamp) {
                        // 使用瀏覽器本機時鐘與伺服器換算的時間戳對齊
                        const nowTs = Date.now() / 1000;
                        remaining = Math.max(0, Math.floor(info.reset_timestamp - nowTs));
                    } else if (info.remaining_seconds) {
                        remaining = Math.max(0, info.remaining_seconds);
                    }
                    this.quotaRemainingSeconds = remaining;

                    const hours = Math.floor(remaining / 3600);
                    const minutes = Math.floor((remaining % 3600) / 60);
                    const seconds = Math.floor(remaining % 60);

                    const pad = (n) => String(n).padStart(2, '0');
                    this.quotaCountdownText = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
                    this.quotaRemainingFormatted = `${hours} 小時 ${minutes} 分鐘 ${seconds} 秒`;
                },

                startQuotaTicker() {
                    if (this.quotaTickerId) return;
                    this.quotaTickerId = setInterval(() => {
                        if (this.quotaStatus && this.quotaStatus.all_free_exhausted && this.quotaStatus.reset_info) {
                            this.updateQuotaCountdown();
                            if (this.quotaRemainingSeconds <= 0) {
                                // 倒數結束，再次拉取 API 確認伺服器狀態
                                this.checkQuotaStatus();
                            }
                        }
                    }, 1000);
                },

                openQuotaModal() {
                    this.showQuotaModal = true;
                    this.updateQuotaCountdown();
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                closeQuotaModal() {
                    this.showQuotaModal = false;
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                async resetQuotaAndResume() {
                    try {
                        const res = await fetch('/api/quota/reset-tracking', { method: 'POST' });
                        if (res.ok) {
                            this.showToast('✅ 免費配額狀態已重置！正在接續未完任務...');
                            this.closeQuotaModal();
                            await this.checkQuotaStatus();
                            await this.loadAccounts();
                            // 接續全站暫停中或失敗的任務
                            await this.resumeAllTasks();
                        } else {
                            this.showToast('⚠️ 重置配額失敗，請檢查網路連線');
                        }
                    } catch (e) {
                        console.error('Error resetting quota tracking:', e);
                        this.showToast('❌ 重置發生例外: ' + (e.message || e));
                    }
                },

                downloadTaskExport(taskId, fmt) {
                    window.open(`/api/tasks/${taskId}/download/${fmt}`, '_blank');
                },

                async pollTaskDetail() {
                    if (!this.currentTaskId) return;
                    const reqTaskId = this.currentTaskId;
                    try {
                        const res = await fetch(`/api/tasks/${reqTaskId}`);
                        const data = await res.json();
                        // 確保返回的結果依然是當前選取的任務，防止異步競態
                        if (this.currentTaskId === reqTaskId && data.task) {
                            this.currentTask = data.task;
                            this.pages = data.pages || [];
                            if (this.pages.length > 0) {
                                if (!this.selectedPageNum || !this.pages.some(p => p.page_num === this.selectedPageNum)) {
                                    this.selectedPageNum = this.pages[0].page_num;
                                }
                            } else {
                                this.selectedPageNum = null;
                            }
                            if (this.currentPage) {
                                this.currentPageText = this.currentPage.ocr_text || '';
                            }
                        }
                    } catch (err) {
                        console.error('Failed to fetch task detail:', err);
                    }
                },

                listenTaskEvents(taskId) {
                    if (this.eventSource) {
                        this.eventSource.close();
                        this.eventSource = null;
                    }
                    this.eventSource = new EventSource(`/api/tasks/${taskId}/events`);
                    this.eventSource.onmessage = async (event) => {
                        try {
                            const payload = JSON.parse(event.data);

                            // 檢查是否包含免費配額耗盡通知
                            if (payload.quota_exhausted) {
                                if (!this.quotaStatus.all_free_exhausted) {
                                    this.openQuotaModal();
                                }
                                this.quotaStatus.all_free_exhausted = true;
                                if (payload.quota_reset_info) {
                                    this.quotaStatus.reset_info = payload.quota_reset_info;
                                    this.updateQuotaCountdown();
                                }
                            }

                            // 1. 精準更新任務清單中對應的 task 項目
                            const targetTask = this.allTasks.find(t => t.id === payload.task_id);
                            if (targetTask) {
                                targetTask.status = payload.status;
                                targetTask.total_pages = payload.total_pages;
                                targetTask.processed_pages = payload.processed_pages;
                                targetTask.rendered_pages = payload.rendered_pages || 0;
                            }

                            // 2. 只有當前檢視/校對的任務 ID 與事件的 task_id 一致時，才更新校對區塊與重新拉取頁面細節
                            if (this.currentTaskId === payload.task_id && this.currentTask) {
                                this.currentTask.status = payload.status;
                                this.currentTask.total_pages = payload.total_pages;
                                this.currentTask.processed_pages = payload.processed_pages;
                                this.currentTask.rendered_pages = payload.rendered_pages || 0;
                                if (payload.pdf_total_pages) this.currentTask.pdf_total_pages = payload.pdf_total_pages;
                                if (payload.bg_render_status) this.currentTask.bg_render_status = payload.bg_render_status;
                                if (payload.start_page) this.currentTask.start_page = payload.start_page;
                                if (payload.end_page) this.currentTask.end_page = payload.end_page;
                                if (payload.model) this.currentTask.model = payload.model;
                                if (payload.is_paid !== undefined) this.currentTask.is_paid = payload.is_paid;

                                this.liveAvgSpeed = payload.avg_speed || 0;
                                this.liveEtaSeconds = payload.eta_seconds || 0;
                                this.liveActivePage = payload.active_page || null;
                                this.liveActiveMsg = payload.active_msg || '';

                                await this.pollTaskDetail();
                            }

                            // 3. 同步更新重新辨識佇列中屬於此任務的單頁狀態
                            if (payload.pages && Array.isArray(payload.pages)) {
                                for (const p of payload.pages) {
                                    const matchedJob = this.reocrQueue.find(j => j.taskId === payload.task_id && j.pageNum === p.page_num && j.status === 'processing');
                                    if (matchedJob) {
                                        if (p.status === 'completed') {
                                            matchedJob.status = 'completed';
                                            matchedJob.duration = p.duration_seconds || p.duration || (matchedJob.startedAt ? Math.round((Date.now() - matchedJob.startedAt) / 100) / 10 : null);
                                            if (p.used_model) matchedJob.model = p.used_model;
                                            matchedJob.error = null;
                                            this.saveReocrQueue();
                                            this.showToast(`✅ [${matchedJob.taskFilename}] 第 ${matchedJob.pageNum} 頁辨識完成！耗時 ${matchedJob.duration || 0}s`);
                                        } else if (p.status === 'failed') {
                                            matchedJob.status = 'failed';
                                            matchedJob.duration = p.duration_seconds || p.duration || (matchedJob.startedAt ? Math.round((Date.now() - matchedJob.startedAt) / 100) / 10 : null);
                                            matchedJob.error = p.error_message || '辨識失敗或配額耗盡';
                                            this.saveReocrQueue();
                                            this.showToast(`⚠️ [${matchedJob.taskFilename}] 第 ${matchedJob.pageNum} 頁辨識失敗: ${matchedJob.error}`);
                                        } else if (p.status === 'paused') {
                                            matchedJob.status = 'paused';
                                            matchedJob.error = p.error_message || '已手動暫停';
                                            this.saveReocrQueue();
                                        }
                                    }
                                }
                            }

                            // 若任務整體失敗，同步更新佇列中該任務殘留的 processing 狀態
                            if (payload.status === 'failed') {
                                let failedAny = false;
                                for (const j of this.reocrQueue) {
                                    if (j.taskId === payload.task_id && j.status === 'processing') {
                                        j.status = 'failed';
                                        j.error = payload.error_message || '所屬任務已終止或失敗';
                                        failedAny = true;
                                    }
                                }
                                if (failedAny) this.saveReocrQueue();
                            }

                            // 4. 若該任務已結束或暫停，且目前無任何單頁在 processing，關閉此連線
                            const hasProcessingPage = payload.pages && payload.pages.some(p => p.status === 'processing');
                            if (['completed', 'failed', 'paused'].includes(payload.status) && !hasProcessingPage) {
                                if (this.eventSource) {
                                    this.eventSource.close();
                                    this.eventSource = null;
                                }
                            }
                        } catch (err) {
                            console.error('SSE onmessage error:', err);
                        }
                    };
                    this.eventSource.onerror = () => {
                        if (this.eventSource) {
                            this.eventSource.close();
                            this.eventSource = null;
                        }
                    };
                },

                prevPage() {
                    if (!this.currentTask || !this.pages || this.pages.length === 0) return;
                    const currentIndex = this.pages.findIndex(p => p.page_num === this.selectedPageNum);
                    if (currentIndex > 0) {
                        this.selectPage(this.pages[currentIndex - 1].page_num);
                    }
                },

                nextPage() {
                    if (!this.currentTask || !this.pages || this.pages.length === 0) return;
                    const currentIndex = this.pages.findIndex(p => p.page_num === this.selectedPageNum);
                    if (currentIndex !== -1 && currentIndex < this.pages.length - 1) {
                        this.selectPage(this.pages[currentIndex + 1].page_num);
                    }
                },

                handleKeyDown(e) {
                    const target = e.target;
                    const tag = target && target.tagName;
                    // 編輯焦點判斷需含 contenteditable，否則會搶走輸入框的按鍵
                    const isEditing = !!target && (
                        tag === 'TEXTAREA' || tag === 'INPUT' ||
                        tag === 'SELECT' || target.isContentEditable === true
                    );

                    // ⚠️ 一律使用 e.code（實體鍵位置），不要用 e.key。
                    //
                    // macOS 的 Option(⌥) 是「組合鍵」，會改寫 e.key：
                    //   ⌥Q → 'œ'   ⌥R → '®'   ⌥U → Dead(死鍵)
                    //   ⌥P → 'π'   ⌥[ → '“'   ⌥] → '‘'
                    // 所以用 e.key 比對字母／括號，在 macOS 上會全部失效。
                    // e.code 不受修飾鍵與輸入法影響，兩個平台都可靠。
                    const code = e.code || '';
                    const key = (e.key || '').toLowerCase();
                    const isPlain = !e.altKey && !e.ctrlKey && !e.metaKey;

                    // 1. Esc 關閉彈窗
                    if (code === 'Escape' || key === 'escape') {
                        if (this.showQueueModal) {
                            e.preventDefault();
                            this.showQueueModal = false;
                            return;
                        }
                        if (this.showAccountsModal) {
                            e.preventDefault();
                            this.showAccountsModal = false;
                            return;
                        }
                        if (this.showAdminModal) {
                            e.preventDefault();
                            this.showAdminModal = false;
                            return;
                        }
                        if (this.showAdminLoginModal) {
                            e.preventDefault();
                            this.showAdminLoginModal = false;
                            return;
                        }
                    }

                    // 2. ⌥/Alt + Q，或非編輯焦點下單按 Q：開關重辨佇列
                    if ((e.altKey && code === 'KeyQ') ||
                        (isPlain && !isEditing && code === 'KeyQ')) {
                        e.preventDefault();
                        this.toggleQueueModal();
                        return;
                    }

                    // 3. 只有在校對狀態（已開啟任務且有頁面）才作用的快捷鍵
                    if (!this.currentTask || !this.pages || this.pages.length === 0) return;

                    // ⌘S / Ctrl+S 快速儲存（兩個平台的慣用鍵都支援）
                    if ((e.metaKey || e.ctrlKey) && code === 'KeyS') {
                        e.preventDefault();
                        this.saveCurrentPageText();
                        return;
                    }

                    // ⌥/Alt + R：以原任務模型重新辨識本頁
                    if (e.altKey && code === 'KeyR') {
                        e.preventDefault();
                        this.retryCurrentPage();
                        return;
                    }

                    // ⌥/Alt + U：以升級模型重新辨識本頁
                    if (e.altKey && code === 'KeyU') {
                        e.preventDefault();
                        this.retryWithUpgradeModel();
                        return;
                    }

                    // ⌥/Alt + P：暫停 / 繼續本頁
                    if (e.altKey && code === 'KeyP') {
                        e.preventDefault();
                        if (this.currentPage?.status === 'processing') {
                            this.pauseCurrentPage();
                        } else if (this.currentPage?.status === 'paused') {
                            this.retryCurrentPage();
                        }
                        return;
                    }

                    // ── 翻頁 ────────────────────────────────────────────
                    const isPrev = code === 'ArrowLeft' || code === 'BracketLeft'
                                || key === 'arrowleft' || key === 'pageup' || code === 'PageUp';
                    const isNext = code === 'ArrowRight' || code === 'BracketRight'
                                || key === 'arrowright' || key === 'pagedown' || code === 'PageDown';

                    if (isEditing) {
                        // 編輯中不搶單鍵（←/→ 是游標移動、[ ] 是打字）。
                        //
                        // macOS 特別處理：⌥←/⌥→ 是系統原生的「逐詞移動游標」，
                        // 編輯時搶走會嚴重破壞打字體驗，因此改用 ⌥[ / ⌥] 翻頁。
                        // Windows/Linux 的 Alt+←/→ 沒有這個衝突，維持可用。
                        const allowAltArrow = !this.isMacPlatform;
                        const altPrev = e.altKey &&
                            (code === 'BracketLeft' || (allowAltArrow && code === 'ArrowLeft'));
                        const altNext = e.altKey &&
                            (code === 'BracketRight' || (allowAltArrow && code === 'ArrowRight'));
                        // MacBook 沒有 PageUp/PageDown 實體鍵，需 Fn+↑ / Fn+↓
                        const pgPrev = isPlain && (key === 'pageup' || code === 'PageUp');
                        const pgNext = isPlain && (key === 'pagedown' || code === 'PageDown');

                        if (altPrev || pgPrev) { e.preventDefault(); this.prevPage(); return; }
                        if (altNext || pgNext) { e.preventDefault(); this.nextPage(); return; }
                        return;
                    }

                    // 非編輯焦點：單鍵或 ⌥/Alt 組合皆可
                    if (isPrev) {
                        e.preventDefault();
                        this.prevPage();
                    } else if (isNext) {
                        e.preventDefault();
                        this.nextPage();
                    }
                },

                extractErrorMessage(errData, fallback = '操作失敗') {
                    if (!errData) return fallback;
                    if (typeof errData === 'string') return errData;
                    if (errData.detail) {
                        if (typeof errData.detail === 'string') return errData.detail;
                        if (Array.isArray(errData.detail)) {
                            return errData.detail.map(d => d.msg || (d.loc ? `${d.loc.join('.')}: ${d.msg}` : JSON.stringify(d))).join('; ');
                        }
                        return JSON.stringify(errData.detail);
                    }
                    if (errData.message && typeof errData.message === 'string') return errData.message;
                    if (errData.error && typeof errData.error === 'string') return errData.error;
                    return fallback;
                },

                showToast(msg) {
                    this.toastMessage = msg;
                    if (this.toastTimeout) clearTimeout(this.toastTimeout);
                    this.toastTimeout = setTimeout(() => {
                        this.toastMessage = '';
                    }, 3500);
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                saveReocrQueue() {
                    try {
                        const seen = new Set();
                        this.reocrQueue = this.reocrQueue.filter(j => {
                            const key = `${j.taskId}_${j.pageNum}`;
                            if (seen.has(key)) return false;
                            seen.add(key);
                            return true;
                        });
                        localStorage.setItem('gasocr_reocr_queue', JSON.stringify(this.reocrQueue.slice(0, 50)));
                    } catch (e) {
                        console.error('Failed to save reocrQueue:', e);
                    }
                },

                clearCompletedReocrQueue() {
                    this.reocrQueue = this.reocrQueue.filter(j => j.status === 'processing' || j.status === 'paused');
                    this.saveReocrQueue();
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                async retryAllFailedReocr() {
                    const failedJobs = this.reocrQueue.filter(j => j.status === 'failed');
                    if (failedJobs.length === 0) return;
                    this.showToast(`🔄 正在重新發起 ${failedJobs.length} 個失敗項目的重辨...`);
                    for (const job of failedJobs) {
                        await this.resumeReocrJob(job);
                        await new Promise(r => setTimeout(r, 200));
                    }
                },

                clearAllReocrQueue() {
                    if (this.reocrQueue.length === 0) return;
                    if (confirm('確定要清空所有重新辨識紀錄嗎？')) {
                        this.reocrQueue = [];
                        this.saveReocrQueue();
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                removeReocrJob(jobId) {
                    this.reocrQueue = this.reocrQueue.filter(j => j.id !== jobId);
                    this.saveReocrQueue();
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                toggleQueueModal() {
                    this.showQueueModal = !this.showQueueModal;
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                async goToReocrJob(job) {
                    if (!job || !job.taskId) return;
                    try {
                        let targetTask = this.allTasks.find(t => t.id === job.taskId);
                        if (!targetTask) {
                            await this.loadTasks();
                            targetTask = this.allTasks.find(t => t.id === job.taskId);
                        }
                        if (targetTask) {
                            await this.inspectTask(targetTask);
                        } else {
                            const res = await fetch(`/api/tasks/${job.taskId}`);
                            if (!res.ok) {
                                job.status = 'failed';
                                job.error = res.status === 404 ? '該任務不存在或已被刪除' : `伺服器回應異常 (HTTP ${res.status})`;
                                this.saveReocrQueue();
                                this.showToast(`⚠️ 無法載入任務：${job.error}`);
                                return;
                            }
                            const data = await res.json();
                            if (data && data.task) {
                                this.currentTaskId = job.taskId;
                                this.currentTask = data.task;
                                this.pages = data.pages || [];
                            } else {
                                job.status = 'failed';
                                job.error = '任務資料異常';
                                this.saveReocrQueue();
                                this.showToast('⚠️ 任務資料異常');
                                return;
                            }
                        }
                        if (job.pageNum) {
                            const exists = this.pages && this.pages.some(p => p.page_num === job.pageNum);
                            if (exists) {
                                this.selectPage(job.pageNum);
                            } else if (this.pages && this.pages.length > 0) {
                                this.selectPage(this.pages[0].page_num);
                                this.showToast(`ℹ️ 該任務中未找到第 ${job.pageNum} 頁，已自動切換至第 ${this.pages[0].page_num} 頁`);
                            }
                        }
                    } catch (err) {
                        console.error('前往校對任務出錯:', err);
                        this.showToast(`⚠️ 前往校對連線異常: ${err.message || err}`);
                        return;
                    }
                    this.showQueueModal = false;
                    this.$nextTick(() => {
                        const section = document.getElementById('proofread-section');
                        if (section) {
                            section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                        lucide.createIcons();
                    });
                },

                async checkActiveReocrJobs() {
                    const activeJobs = this.reocrQueue.filter(j => j.status === 'processing');
                    if (activeJobs.length === 0) return;

                    const taskIds = [...new Set(activeJobs.map(j => j.taskId))];
                    for (const tid of taskIds) {
                        try {
                            const res = await fetch(`/api/tasks/${tid}`);
                            if (!res.ok) {
                                if (res.status === 404) {
                                    const orphanedJobs = this.reocrQueue.filter(j => j.taskId === tid && j.status === 'processing');
                                    for (const j of orphanedJobs) {
                                        j.status = 'failed';
                                        j.error = '任務不存在或已被刪除';
                                    }
                                    this.saveReocrQueue();
                                }
                                continue;
                            }
                            const data = await res.json();
                            const task = data.task;
                            const pages = data.pages || [];
                            const isTaskTerminated = task && ['completed', 'failed', 'cancelled', 'paused'].includes(task.status);

                            for (const matchedJob of this.reocrQueue.filter(j => j.taskId === tid && j.status === 'processing')) {
                                const page = pages.find(p => p.page_num === matchedJob.pageNum);
                                if (!page) {
                                    if (isTaskTerminated) {
                                        matchedJob.status = 'failed';
                                        matchedJob.error = '任務中找不到此頁面';
                                        this.saveReocrQueue();
                                    }
                                    continue;
                                }

                                if (page.status === 'completed') {
                                    matchedJob.status = 'completed';
                                    matchedJob.duration = page.duration_seconds || (matchedJob.startedAt ? Math.round((Date.now() - matchedJob.startedAt) / 100) / 10 : null);
                                    if (page.used_model) matchedJob.model = page.used_model;
                                    matchedJob.error = null;
                                    this.saveReocrQueue();
                                    this.showToast(`✅ [${matchedJob.taskFilename}] 第 ${matchedJob.pageNum} 頁辨識完成！耗時 ${matchedJob.duration || 0}s`);
                                    if (this.currentTaskId === tid) {
                                        const currP = this.pages.find(p => p.page_num === page.page_num);
                                        if (currP) {
                                            currP.status = 'completed';
                                            currP.ocr_text = page.ocr_text;
                                            currP.used_model = page.used_model;
                                            currP.duration_seconds = page.duration_seconds;
                                            if (this.selectedPageNum === page.page_num) {
                                                this.currentPageText = page.ocr_text || '';
                                            }
                                        }
                                    }
                                } else if (page.status === 'failed') {
                                    matchedJob.status = 'failed';
                                    matchedJob.duration = page.duration_seconds || (matchedJob.startedAt ? Math.round((Date.now() - matchedJob.startedAt) / 100) / 10 : null);
                                    matchedJob.error = page.error_message || '辨識失敗或配額耗盡';
                                    this.saveReocrQueue();
                                    this.showToast(`⚠️ [${matchedJob.taskFilename}] 第 ${matchedJob.pageNum} 頁辨識失敗: ${matchedJob.error}`);
                                    if (this.currentTaskId === tid) {
                                        const currP = this.pages.find(p => p.page_num === page.page_num);
                                        if (currP) {
                                            currP.status = 'failed';
                                            currP.error_message = page.error_message;
                                        }
                                    }
                                } else if (page.status === 'paused') {
                                    matchedJob.status = 'paused';
                                    matchedJob.error = page.error_message || '已手動暫停';
                                    this.saveReocrQueue();
                                    if (this.currentTaskId === tid) {
                                        const currP = this.pages.find(p => p.page_num === page.page_num);
                                        if (currP) {
                                            currP.status = 'paused';
                                        }
                                    }
                                } else if (task && task.status === 'failed' && page.status !== 'processing') {
                                    matchedJob.status = 'failed';
                                    matchedJob.error = task.error_message || '所屬任務已失敗';
                                    this.saveReocrQueue();
                                } else if (task && task.status === 'paused' && page.status !== 'processing') {
                                    matchedJob.status = 'paused';
                                    matchedJob.error = '所屬任務已暫停';
                                    this.saveReocrQueue();
                                }
                            }
                        } catch (err) {
                            console.error('Error polling reocr jobs for task', tid, err);
                        }
                    }
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                selectPage(pageNum) {
                    this.selectedPageNum = pageNum;
                    if (this.currentPage) {
                        this.currentPageText = this.currentPage.ocr_text || '';
                    }
                    this.$nextTick(() => {
                        lucide.createIcons();
                        // 選取按鈕自動平滑滾動至可見區域
                        const activeBtn = document.querySelector(`[data-page-btn="${pageNum}"]`);
                        if (activeBtn) {
                            activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                        }
                    });
                },

                async saveCurrentPageText() {
                    if (!this.currentTaskId || !this.selectedPageNum) return;
                    try {
                        const res = await fetch(`/api/tasks/${this.currentTaskId}/pages/${this.selectedPageNum}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: this.currentPageText })
                        });
                        if (res.ok) {
                            if (this.currentPage) {
                                this.currentPage.ocr_text = this.currentPageText;
                            }
                            alert(`第 ${this.selectedPageNum} 頁修改儲存成功！`);
                        }
                    } catch (err) {
                        alert('儲存失敗: ' + err);
                    }
                },

                async retryCurrentPage(modelOverride = null) {
                    if (!this.currentTaskId || !this.selectedPageNum || this.isRetryingPage) return;
                    this.isRetryingPage = true;
                    this.isRetryingUpgrade = !!modelOverride;
                    if (this.currentPage) {
                        this.currentPage.status = 'processing';
                    }

                    const pageNum = this.selectedPageNum;
                    const taskId = this.currentTaskId;
                    const taskFilename = (this.currentTask && this.currentTask.filename) || '未命名任務';
                    const targetModel = modelOverride || this.currentPage?.used_model || this.currentTask?.model || '{{ default_model | default("gemini-3.5-flash-lite") }}';
                    const isUpgrade = !!modelOverride;

                    // 1. 登記至重辨佇列：對每一頁只保留最新結果的一個 item
                    this.reocrQueue = this.reocrQueue.filter(j => !(j.taskId === taskId && j.pageNum === pageNum));
                    const newJob = {
                        id: 'reocr_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                        taskId: taskId,
                        taskFilename: taskFilename,
                        pageNum: pageNum,
                        model: targetModel,
                        isUpgrade: isUpgrade,
                        status: 'processing',
                        startedAt: Date.now(),
                        formattedTime: new Date().toLocaleTimeString(),
                        duration: null,
                        error: null
                    };
                    this.reocrQueue.unshift(newJob);
                    this.saveReocrQueue();

                    const toastMsg = isUpgrade 
                        ? `✨ 已啟動「升級重新辨識」：第 ${pageNum} 頁 (模型: ${targetModel})` 
                        : `⚡ 已啟動重新辨識：第 ${pageNum} 頁 (模型: ${targetModel})`;
                    this.showToast(toastMsg);

                    const payload = modelOverride ? { model: modelOverride } : {};
                    try {
                        const res = await fetch(`/api/tasks/${taskId}/pages/${pageNum}/retry`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            // 直接執行重新轉譯，不跳出 message 彈窗
                            this.listenTaskEvents(taskId);
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            console.error('重新轉譯失敗:', errData);
                            const errMsg = this.extractErrorMessage(errData, `發起重試失敗 (HTTP ${res.status})`);
                            newJob.status = 'failed';
                            newJob.error = errMsg;
                            this.saveReocrQueue();
                            if (this.currentPage) {
                                this.currentPage.status = 'failed';
                                this.currentPage.error_message = errMsg;
                            }
                            this.showToast(`⚠️ 重新辨識失敗: ${errMsg}`);
                        }
                    } catch (err) {
                        console.error('重新轉譯網路錯誤:', err);
                        const errMsg = err.message || String(err);
                        newJob.status = 'failed';
                        newJob.error = errMsg;
                        this.saveReocrQueue();
                        if (this.currentPage) {
                            this.currentPage.status = 'failed';
                            this.currentPage.error_message = errMsg;
                        }
                        this.showToast(`⚠️ 重新辨識網路錯誤: ${errMsg}`);
                    } finally {
                        this.isRetryingPage = false;
                        this.isRetryingUpgrade = false;
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                retryWithUpgradeModel() {
                    const target = this.upgradeModel || (this.currentTask ? this.currentTask.model : 'gemini-2.5-pro');
                    this.retryCurrentPage(target);
                },

                async pauseCurrentPage() {
                    if (!this.currentTaskId || !this.selectedPageNum) return;
                    const taskId = this.currentTaskId;
                    const pageNum = this.selectedPageNum;
                    try {
                        const res = await fetch(`/api/tasks/${taskId}/pages/${pageNum}/pause`, { method: 'POST' });
                        if (res.ok) {
                            if (this.currentPage) {
                                this.currentPage.status = 'paused';
                            }
                            const matchedJob = this.reocrQueue.find(j => j.taskId === taskId && j.pageNum === pageNum);
                            if (matchedJob) {
                                matchedJob.status = 'paused';
                                matchedJob.error = '已手動暫停';
                                this.saveReocrQueue();
                            }
                            this.showToast(`⏸️ 第 ${pageNum} 頁轉譯已暫停`);
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            const errMsg = this.extractErrorMessage(errData, `暫停失敗 (HTTP ${res.status})`);
                            this.showToast(`⚠️ 暫停失敗: ${errMsg}`);
                        }
                    } catch (err) {
                        console.error('暫停單頁失敗:', err);
                        this.showToast(`⚠️ 暫停連線異常: ${err.message || err}`);
                    } finally {
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async pauseReocrJob(job) {
                    if (!job || !job.taskId || !job.pageNum) return;
                    try {
                        const res = await fetch(`/api/tasks/${job.taskId}/pages/${job.pageNum}/pause`, { method: 'POST' });
                        if (res.ok) {
                            job.status = 'paused';
                            job.error = '已手動暫停';
                            this.saveReocrQueue();
                            if (this.currentTaskId === job.taskId) {
                                const p = this.pages.find(page => page.page_num === job.pageNum);
                                if (p) p.status = 'paused';
                            }
                            this.showToast(`⏸️ [${job.taskFilename}] 第 ${job.pageNum} 頁已暫停`);
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            const errMsg = this.extractErrorMessage(errData, `暫停失敗 (HTTP ${res.status})`);
                            if (res.status === 404) {
                                job.status = 'failed';
                                job.error = '任務不存在或已被刪除';
                                this.saveReocrQueue();
                            }
                            this.showToast(`⚠️ [${job.taskFilename}] 第 ${job.pageNum} 頁暫停失敗: ${errMsg}`);
                        }
                    } catch (err) {
                        console.error('暫停重辨任務失敗:', err);
                        this.showToast(`⚠️ 暫停連線異常: ${err.message || err}`);
                    } finally {
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                async resumeReocrJob(job) {
                    if (!job || !job.taskId || !job.pageNum) return;
                    try {
                        const payload = job.model ? { model: job.model } : {};
                        const res = await fetch(`/api/tasks/${job.taskId}/pages/${job.pageNum}/resume`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (res.ok) {
                            job.status = 'processing';
                            job.error = null;
                            job.startedAt = Date.now();
                            this.saveReocrQueue();
                            if (this.currentTaskId === job.taskId) {
                                const p = this.pages.find(page => page.page_num === job.pageNum);
                                if (p) {
                                    p.status = 'processing';
                                    p.error_message = null;
                                }
                            }
                            this.listenTaskEvents(job.taskId);
                            this.showToast(`▶️ [${job.taskFilename}] 第 ${job.pageNum} 頁已啟動重辨 (模型: ${job.model})`);
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            const errMsg = this.extractErrorMessage(errData, `重試失敗 (HTTP ${res.status})`);
                            job.status = 'failed';
                            job.error = errMsg;
                            this.saveReocrQueue();
                            if (this.currentTaskId === job.taskId) {
                                const p = this.pages.find(page => page.page_num === job.pageNum);
                                if (p) {
                                    p.status = 'failed';
                                    p.error_message = errMsg;
                                }
                            }
                            this.showToast(`⚠️ [${job.taskFilename}] 第 ${job.pageNum} 頁重試失敗: ${errMsg}`);
                        }
                    } catch (err) {
                        console.error('繼續重辨任務失敗:', err);
                        const errMsg = err.message || String(err);
                        job.status = 'failed';
                        job.error = errMsg;
                        this.saveReocrQueue();
                        if (this.currentTaskId === job.taskId) {
                            const p = this.pages.find(page => page.page_num === job.pageNum);
                            if (p) {
                                p.status = 'failed';
                                p.error_message = errMsg;
                            }
                        }
                        this.showToast(`⚠️ [${job.taskFilename}] 第 ${job.pageNum} 頁重試網路異常: ${errMsg}`);
                    } finally {
                        this.$nextTick(() => { lucide.createIcons(); });
                    }
                },

                downloadExport(fmt) {
                    if (!this.currentTaskId) return;
                    window.open(`/api/tasks/${this.currentTaskId}/download/${fmt}`, '_blank');
                }
            }
        }
    </script>
