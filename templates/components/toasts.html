    <!-- Global Floating Toast Notification -->
    <div 
        x-show="toastMessage" 
        x-transition:enter="transition ease-out duration-300 transform"
        x-transition:enter-start="opacity-0 translate-y-3 scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 scale-100"
        x-transition:leave="transition ease-in duration-200 transform"
        x-transition:leave-start="opacity-100 translate-y-0 scale-100"
        x-transition:leave-end="opacity-0 translate-y-3 scale-95"
        class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-xl shadow-2xl backdrop-blur-md flex items-center space-x-2.5 text-xs font-medium border pointer-events-none reocr-toast"
        style="display: none;"
    >
        <i data-lucide="sparkles" class="w-4 h-4 shrink-0 reocr-toast-icon"></i>
        <span x-text="toastMessage"></span>
    </div>
